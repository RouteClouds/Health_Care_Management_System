name: Stage 3 CI (Advanced DevOps)

on:
  push:
    branches: [ main, develop ]
    paths:
      # ONLY trigger on changes within src-code directory (including any files/docs within it)
      - 'Project-Stages/Project-Stage-3-Advanced-DevOps-Pipeline/src-code/**'
      # Include the workflow file itself for pipeline updates
      - '.github/workflows/stage3-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      # ONLY trigger on changes within src-code directory (including any files/docs within it)
      - 'Project-Stages/Project-Stage-3-Advanced-DevOps-Pipeline/src-code/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'dev'
        type: choice
        options:
        - dev
        - staging
        - prod

# Add permissions for the workflow to write to the repository
permissions:
  contents: write          # Required to push changes back to repository
  pull-requests: read      # Required to read PR information
  actions: read           # Required to read workflow information
  security-events: write  # Required for security scanning results

env:
  SOURCE_CODE_PATH: './Project-Stages/Project-Stage-3-Advanced-DevOps-Pipeline/src-code'
  TERRAFORM_PATH: './Project-Stages/Project-Stage-3-Advanced-DevOps-Pipeline/terraform'
  STAGE: 'stage-3'
  AWS_REGION: 'us-east-1'
  # ECR Registry will be dynamically detected from AWS Account ID: 867344452513

concurrency:
  group: stage3-dev
  cancel-in-progress: true

jobs:
  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Terraform Format Check
        working-directory: ${{ env.TERRAFORM_PATH }}
        run: terraform fmt -check

      - name: Terraform Init
        working-directory: ${{ env.TERRAFORM_PATH }}
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: ${{ env.TERRAFORM_PATH }}
        run: terraform validate

  unit-tests:
    name: Unit Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18.x, 20.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: '${{ env.SOURCE_CODE_PATH }}/package-lock.json'

      - name: Install dependencies
        working-directory: ${{ env.SOURCE_CODE_PATH }}
        run: |
          npm install
          cd frontend && npm install
          cd ../backend && npm install

      - name: Run unit tests
        working-directory: ${{ env.SOURCE_CODE_PATH }}
        run: npm run test:unit

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '${{ env.SOURCE_CODE_PATH }}'
          format: 'sarif'
          output: 'trivy-results.sarif'

  build-images:
    name: Build and Push Images
    runs-on: ubuntu-latest
    needs: [terraform-validate, unit-tests, security-scan]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create ECR repositories if they don't exist
        run: |
          echo "🏗️ Ensuring ECR repositories exist..."

          # Create frontend repository
          aws ecr describe-repositories --repository-names healthcare-frontend-stage3 --region us-east-1 || \
          aws ecr create-repository --repository-name healthcare-frontend-stage3 --region us-east-1 \
            --image-scanning-configuration scanOnPush=true \
            --encryption-configuration encryptionType=AES256

          # Create backend repository
          aws ecr describe-repositories --repository-names healthcare-backend-stage3 --region us-east-1 || \
          aws ecr create-repository --repository-name healthcare-backend-stage3 --region us-east-1 \
            --image-scanning-configuration scanOnPush=true \
            --encryption-configuration encryptionType=AES256

          echo "✅ ECR repositories ready"

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push images
        working-directory: ${{ env.SOURCE_CODE_PATH }}
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY_FRONTEND: healthcare-frontend-stage3
          ECR_REPOSITORY_BACKEND: healthcare-backend-stage3
          IMAGE_TAG: ${{ github.sha }}
          BUILD_DATE: ${{ github.run_number }}
        run: |
          echo "🔨 Building fresh images with no cache..."
          echo "Commit SHA: $IMAGE_TAG"
          echo "Build Number: $BUILD_DATE"

          # Configure Docker for better network resilience
          echo "🔧 Configuring Docker for network resilience..."

          # Set Docker daemon configuration for better timeouts
          sudo mkdir -p /etc/docker
          echo '{
            "max-concurrent-downloads": 3,
            "max-concurrent-uploads": 3,
            "registry-mirrors": ["https://mirror.gcr.io"],
            "insecure-registries": [],
            "debug": false,
            "experimental": false
          }' | sudo tee /etc/docker/daemon.json

          # Restart Docker daemon
          sudo systemctl restart docker
          sleep 10

          # Build frontend with network resilience
          echo "🏗️ Building frontend image with network resilience..."

          # Retry mechanism for frontend build
          for attempt in 1 2 3; do
            echo "Frontend build attempt $attempt/3..."
            if docker build \
              --build-arg BUILD_DATE=$BUILD_DATE \
              --build-arg COMMIT_SHA=$IMAGE_TAG \
              --build-arg VITE_API_BASE_URL=/api \
              --build-arg VITE_APP_NAME="RouteClouds Health Platform" \
              --build-arg VITE_APP_VERSION="1.0.0" \
              --network=host \
              -f Dockerfile.frontend \
              -t $ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:$IMAGE_TAG \
              -t $ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:latest .; then
              echo "✅ Frontend build successful on attempt $attempt"
              break
            else
              echo "❌ Frontend build failed on attempt $attempt"
              if [ $attempt -eq 3 ]; then
                echo "💥 Frontend build failed after 3 attempts"
                exit 1
              fi
              echo "⏳ Waiting 30 seconds before retry..."
              sleep 30
            fi
          done

          # Build backend with network resilience
          echo "🏗️ Building backend image with network resilience..."

          # Retry mechanism for backend build
          for attempt in 1 2 3; do
            echo "Backend build attempt $attempt/3..."
            if docker build \
              --build-arg BUILD_DATE=$BUILD_DATE \
              --build-arg COMMIT_SHA=$IMAGE_TAG \
              --network=host \
              -f Dockerfile.backend \
              -t $ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:$IMAGE_TAG \
              -t $ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:latest .; then
              echo "✅ Backend build successful on attempt $attempt"
              break
            else
              echo "❌ Backend build failed on attempt $attempt"
              if [ $attempt -eq 3 ]; then
                echo "💥 Backend build failed after 3 attempts"
                exit 1
              fi
              echo "⏳ Waiting 30 seconds before retry..."
              sleep 30
            fi
          done

          # Verify images were built
          echo "📋 Built images:"
          docker images | grep healthcare

          # Push images
          echo "📤 Pushing frontend images..."
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:latest

          echo "📤 Pushing backend images..."
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:latest

          echo "✅ All images pushed successfully"

  update-gitops:
    name: Update GitOps Manifests (Automated)
    runs-on: ubuntu-latest
    needs: [build-images]  # Changed: Run after images are built, not after infrastructure
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          persist-credentials: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get AWS Account ID and ECR Registry
        id: aws-info
        run: |
          AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          echo "aws-account-id=${AWS_ACCOUNT_ID}" >> $GITHUB_OUTPUT
          echo "ecr-registry=${ECR_REGISTRY}" >> $GITHUB_OUTPUT
          echo "✅ AWS Account ID: ${AWS_ACCOUNT_ID}"
          echo "✅ ECR Registry: ${ECR_REGISTRY}"

      - name: Update GitOps manifests with precise image tags
        working-directory: Project-Stages/Project-Stage-3-Advanced-DevOps-Pipeline/gitops
        env:
          IMAGE_TAG: ${{ github.sha }}
          ECR_REGISTRY: ${{ steps.aws-info.outputs.ecr-registry }}
        run: |
          echo "🔄 Updating GitOps manifests with automated image tags..."
          echo "Commit SHA: ${IMAGE_TAG}"
          echo "ECR Registry: ${ECR_REGISTRY}"

          # Update frontend image with precise pattern matching
          echo "📝 Updating frontend image tag..."
          sed -i "s|image: .*healthcare-frontend-stage3:.*|image: ${ECR_REGISTRY}/healthcare-frontend-stage3:${IMAGE_TAG}|g" environments/dev/frontend.yaml

          # Update backend image with precise pattern matching
          echo "📝 Updating backend image tag..."
          sed -i "s|image: .*healthcare-backend-stage3:.*|image: ${ECR_REGISTRY}/healthcare-backend-stage3:${IMAGE_TAG}|g" environments/dev/backend.yaml

          # Verify changes were made
          echo ""
          echo "=== GitOps Manifest Updates Verification ==="
          echo "Frontend image updated to:"
          grep "image:.*healthcare-frontend-stage3" environments/dev/frontend.yaml || echo "❌ Frontend image not found"
          echo ""
          echo "Backend image updated to:"
          grep "image:.*healthcare-backend-stage3" environments/dev/backend.yaml || echo "❌ Backend image not found"
          echo ""

          # Validate that the image tags match the commit SHA
          if grep -q "${IMAGE_TAG}" environments/dev/frontend.yaml && grep -q "${IMAGE_TAG}" environments/dev/backend.yaml; then
            echo "✅ GitOps manifests successfully updated with commit SHA: ${IMAGE_TAG}"
          else
            echo "❌ GitOps manifest update failed - image tags don't match commit SHA"
            exit 1
          fi

      - name: Commit and push GitOps changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: |
            🤖 GitOps: Auto-update Stage-3 image tags to ${{ github.sha }}

            - Frontend: ${{ steps.aws-info.outputs.ecr-registry }}/healthcare-frontend-stage3:${{ github.sha }}
            - Backend: ${{ steps.aws-info.outputs.ecr-registry }}/healthcare-backend-stage3:${{ github.sha }}

            This commit was automatically generated by the CI/CD pipeline to ensure
            GitOps manifests always use the latest built images without manual intervention.
          file_pattern: "Project-Stages/Project-Stage-3-Advanced-DevOps-Pipeline/gitops/environments/dev/*.yaml"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"
          commit_author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"

  setup-terraform-backend:
    name: Setup Terraform Backend
    runs-on: ubuntu-latest
    needs: [update-gitops]
    if: github.ref == 'refs/heads/main'
    outputs:
      backend-bucket: ${{ steps.backend-setup.outputs.bucket-name }}
      backend-table: ${{ steps.backend-setup.outputs.table-name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Setup Terraform Backend
        id: backend-setup
        working-directory: ${{ env.TERRAFORM_PATH }}/backend-setup
        run: |
          echo "🔧 Setting up Terraform backend infrastructure..."

          # Check if backend resources already exist
          AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          EXPECTED_TABLE="healthcare-terraform-locks-stage3"

          # ✅ FIXED: Look for existing bucket first (idempotent behavior)
          echo "🔍 Looking for existing S3 backend bucket..."
          EXISTING_BUCKET=$(aws s3api list-buckets --query "Buckets[?starts_with(Name, 'healthcare-terraform-state-stage3-${AWS_ACCOUNT_ID}')].Name" --output text | tr '\t' '\n' | head -1)

          if [[ -n "$EXISTING_BUCKET" && "$EXISTING_BUCKET" != "None" ]]; then
            BUCKET_NAME="$EXISTING_BUCKET"
            echo "✅ Found existing S3 bucket: $BUCKET_NAME"
            BUCKET_EXISTS=true
          else
            # Only generate random suffix if no existing bucket found
            RANDOM_SUFFIX=$(shuf -i 1000-9999 -n 1)
            BUCKET_NAME="healthcare-terraform-state-stage3-${AWS_ACCOUNT_ID}-${RANDOM_SUFFIX}"
            echo "📋 No existing bucket found, will create: $BUCKET_NAME"
            BUCKET_EXISTS=false
          fi

          # Check if DynamoDB table exists
          if aws dynamodb describe-table --table-name "$EXPECTED_TABLE" --region ${{ env.AWS_REGION }} >/dev/null 2>&1; then
            echo "✅ DynamoDB table '$EXPECTED_TABLE' already exists"
            TABLE_EXISTS=true
          else
            echo "📋 DynamoDB table '$EXPECTED_TABLE' does not exist, will create"
            TABLE_EXISTS=false
          fi

          # If both resources exist and are functional, skip Terraform operations
          if [[ "$BUCKET_EXISTS" == "true" ]] && [[ "$TABLE_EXISTS" == "true" ]]; then
            echo "🎯 Both S3 bucket and DynamoDB table exist, testing functionality..."

            # Test S3 bucket access
            if aws s3 ls "s3://$BUCKET_NAME" >/dev/null 2>&1; then
              echo "✅ S3 bucket is accessible"
              S3_FUNCTIONAL=true
            else
              echo "⚠️ S3 bucket exists but not accessible"
              S3_FUNCTIONAL=false
            fi

            # Test DynamoDB table access
            if aws dynamodb describe-table --table-name "$EXPECTED_TABLE" --region ${{ env.AWS_REGION }} >/dev/null 2>&1; then
              echo "✅ DynamoDB table is accessible"
              DYNAMO_FUNCTIONAL=true
            else
              echo "⚠️ DynamoDB table exists but not accessible"
              DYNAMO_FUNCTIONAL=false
            fi

            # If both are functional, skip Terraform operations
            if [[ "$S3_FUNCTIONAL" == "true" ]] && [[ "$DYNAMO_FUNCTIONAL" == "true" ]]; then
              echo "🚀 Both resources are functional, skipping Terraform operations"
              echo "bucket-name=$BUCKET_NAME" >> $GITHUB_OUTPUT
              echo "table-name=$EXPECTED_TABLE" >> $GITHUB_OUTPUT
              echo "✅ Terraform backend setup completed (using existing functional resources)"
              echo "S3 Bucket: $BUCKET_NAME"
              echo "DynamoDB Table: $EXPECTED_TABLE"
              exit 0
            fi
          fi

          # Initialize Terraform for backend setup
          terraform init

          # Check if resources are already in Terraform state
          echo "🔍 Checking Terraform state for existing resources..."

          # Check if DynamoDB table is in state
          if terraform state list | grep -q "aws_dynamodb_table.terraform_locks"; then
            echo "✅ DynamoDB table already in Terraform state"
            TABLE_IN_STATE=true
          else
            TABLE_IN_STATE=false
          fi

          # Check if S3 bucket is in state
          if terraform state list | grep -q "aws_s3_bucket.terraform_state"; then
            echo "✅ S3 bucket already in Terraform state"
            BUCKET_IN_STATE=true
          else
            BUCKET_IN_STATE=false
          fi

          # Import existing resources if they exist but not in state
          if [[ "$TABLE_EXISTS" == "true" && "$TABLE_IN_STATE" == "false" ]]; then
            echo "🔄 Importing existing DynamoDB table..."
            terraform import aws_dynamodb_table.terraform_locks "$EXPECTED_TABLE" || {
              echo "⚠️ DynamoDB import failed, will try to create or use existing"
            }
          fi

          if [[ "$BUCKET_EXISTS" == "true" && "$BUCKET_IN_STATE" == "false" ]]; then
            echo "🔄 Importing existing S3 bucket..."
            terraform import aws_s3_bucket.terraform_state "$BUCKET_NAME" || {
              echo "⚠️ S3 import failed, will try to create or use existing"
            }
          fi

          # Plan backend resources
          echo "📋 Planning backend resources..."
          terraform plan -out=backend-plan

          # Apply backend resources with enhanced error handling
          echo "🚀 Applying backend resources..."

          # Apply with specific error handling for "already exists" scenarios
          terraform apply -auto-approve backend-plan 2>&1 | tee apply_output.log || {
            APPLY_EXIT_CODE=$?
            echo "⚠️ Terraform apply failed (exit code: $APPLY_EXIT_CODE)"

            # Check if failure is due to "already exists" errors
            if grep -q "ResourceInUseException.*already exists" apply_output.log || grep -q "BucketAlreadyExists" apply_output.log; then
              echo "🔍 Detected 'already exists' errors - resources are already created"

              # Verify resources are functional
              if [[ "$BUCKET_EXISTS" == "true" ]] && [[ "$TABLE_EXISTS" == "true" ]]; then
                echo "✅ Resources exist and are functional, using existing setup"
                echo "bucket-name=$BUCKET_NAME" >> $GITHUB_OUTPUT
                echo "table-name=$EXPECTED_TABLE" >> $GITHUB_OUTPUT
                echo "✅ Terraform backend setup completed (using existing resources)"
                echo "S3 Bucket: $BUCKET_NAME"
                echo "DynamoDB Table: $EXPECTED_TABLE"
                exit 0
              fi
            fi

            # For other types of failures, still try to use existing resources if they're functional
            if [[ "$BUCKET_EXISTS" == "true" ]] && [[ "$TABLE_EXISTS" == "true" ]]; then
              echo "✅ Using existing backend resources despite apply failure"
              echo "bucket-name=$BUCKET_NAME" >> $GITHUB_OUTPUT
              echo "table-name=$EXPECTED_TABLE" >> $GITHUB_OUTPUT
              echo "✅ Terraform backend setup completed (using existing resources)"
              echo "S3 Bucket: $BUCKET_NAME"
              echo "DynamoDB Table: $EXPECTED_TABLE"
              exit 0
            else
              echo "❌ Backend setup failed and resources don't exist or aren't functional"
              echo "Apply output:"
              cat apply_output.log
              exit 1
            fi
          }

          # Get outputs from Terraform
          BUCKET_NAME=$(terraform output -raw s3_bucket_name 2>/dev/null || echo "$BUCKET_NAME")
          TABLE_NAME=$(terraform output -raw dynamodb_table_name 2>/dev/null || echo "$EXPECTED_TABLE")

          echo "bucket-name=$BUCKET_NAME" >> $GITHUB_OUTPUT
          echo "table-name=$TABLE_NAME" >> $GITHUB_OUTPUT

          echo "✅ Terraform backend setup completed"
          echo "S3 Bucket: $BUCKET_NAME"
          echo "DynamoDB Table: $TABLE_NAME"

  deploy-infrastructure:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    needs: [setup-terraform-backend]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Initialize Terraform with Backend
        working-directory: ${{ env.TERRAFORM_PATH }}/environments/dev
        run: |
          echo "🔧 Initializing Terraform with S3 backend..."
          echo "Backend Bucket: ${{ needs.setup-terraform-backend.outputs.backend-bucket }}"
          echo "Backend Table: ${{ needs.setup-terraform-backend.outputs.backend-table }}"

          # Initialize with dynamic backend configuration (idempotent)
          terraform init \
            -backend-config="bucket=${{ needs.setup-terraform-backend.outputs.backend-bucket }}" \
            -backend-config="key=stage3/dev/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ needs.setup-terraform-backend.outputs.backend-table }}" \
            -backend-config="encrypt=true"

          echo "✅ Terraform initialized with S3 backend (idempotent)"

      - name: Check Existing Infrastructure
        working-directory: ${{ env.TERRAFORM_PATH }}/environments/dev
        id: infra-check
        run: |
          echo "🔍 Checking for existing infrastructure to ensure idempotent deployment..."

          # Check if EKS cluster exists
          if aws eks describe-cluster --name "healthcare-eks-stage3-dev" --region ${{ env.AWS_REGION }} >/dev/null 2>&1; then
            echo "✅ EKS cluster 'healthcare-eks-stage3-dev' already exists"
            CLUSTER_EXISTS=true
          else
            echo "📋 EKS cluster 'healthcare-eks-stage3-dev' does not exist"
            CLUSTER_EXISTS=false
          fi

          # Check if RDS instance exists
          if aws rds describe-db-instances --db-instance-identifier "healthcare-eks-stage3-dev-db" --region ${{ env.AWS_REGION }} >/dev/null 2>&1; then
            echo "✅ RDS instance 'healthcare-eks-stage3-dev-db' already exists"
            RDS_EXISTS=true
          else
            echo "📋 RDS instance 'healthcare-eks-stage3-dev-db' does not exist"
            RDS_EXISTS=false
          fi

          # Check if VPC exists
          VPC_COUNT=$(aws ec2 describe-vpcs --filters "Name=tag:Name,Values=healthcare-eks-stage3-dev-vpc" --query 'Vpcs | length(@)' --output text)
          if [[ "$VPC_COUNT" -gt 0 ]]; then
            echo "✅ VPC 'healthcare-eks-stage3-dev-vpc' already exists (count: $VPC_COUNT)"
            VPC_EXISTS=true
          else
            echo "📋 VPC 'healthcare-eks-stage3-dev-vpc' does not exist"
            VPC_EXISTS=false
          fi

          # Set outputs for conditional deployment
          echo "cluster-exists=$CLUSTER_EXISTS" >> $GITHUB_OUTPUT
          echo "rds-exists=$RDS_EXISTS" >> $GITHUB_OUTPUT
          echo "vpc-exists=$VPC_EXISTS" >> $GITHUB_OUTPUT

          # Summary
          echo ""
          echo "📊 Infrastructure Status Summary:"
          echo "   EKS Cluster: $CLUSTER_EXISTS"
          echo "   RDS Instance: $RDS_EXISTS"
          echo "   VPC: $VPC_EXISTS"

      - name: Preflight Collision Detection
        working-directory: ${{ env.TERRAFORM_PATH }}/environments/dev
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          FAIL_FAST: ${{ vars.FAIL_FAST || 'true' }}
          CLUSTER_NAME: healthcare-eks-stage3-dev
        run: |
          echo "🔍 Running preflight collision checks with adaptive AUTO_IMPORT..."
          # Strictly parse preserve_existing_cluster from a non-comment assignment line
          PRESERVE=$(sed -n -E 's/^[[:space:]]*preserve_existing_cluster[[:space:]]*=[[:space:]]*(true|false).*/\1/p' main.tf | head -n1)
          if [[ -z "$PRESERVE" ]]; then PRESERVE="true"; fi
          echo "PRESERVE flag detected: ${PRESERVE}"

          # Start with repository default
          AUTO_IMPORT_REPO_DEFAULT="${{ vars.AUTO_IMPORT || 'false' }}"
          AUTO_IMPORT="$AUTO_IMPORT_REPO_DEFAULT"

          # If cluster exists while PRESERVE=false (first-time path expected creation), auto-import to avoid hard fail
          if aws eks describe-cluster --name "$CLUSTER_NAME" --region "$AWS_REGION" >/dev/null 2>&1; then
            echo "📌 Cluster exists: $CLUSTER_NAME"
            if [[ "$PRESERVE" == "false" ]]; then
              echo "⚙️  PRESERVE=false but cluster exists. Enabling AUTO_IMPORT=true to reconcile state."
              AUTO_IMPORT="true"
            fi
          fi

          echo "Using AUTO_IMPORT=${AUTO_IMPORT}, FAIL_FAST=${FAIL_FAST}"
          AUTO_IMPORT="$AUTO_IMPORT" FAIL_FAST="$FAIL_FAST" CLUSTER_NAME="$CLUSTER_NAME" AWS_REGION="$AWS_REGION" bash ../../../scripts/preflight/check-collisions.sh


      - name: "Guard: Detect duplicate VPCs (fail-fast)"
        run: |
          echo "🔍 Checking for duplicate VPCs by Name tag..."
          AWS_REGION="${{ env.AWS_REGION }}"
          CLUSTER_NAME="healthcare-eks-stage3-dev"
          VPCS=$(aws ec2 describe-vpcs --region "$AWS_REGION" \
            --filters "Name=tag:Name,Values=${CLUSTER_NAME}-vpc" \
            --query 'Vpcs[].VpcId' --output text || true)
          COUNT=$(echo "$VPCS" | wc -w | tr -d ' ')
          echo "Found $COUNT VPC(s) matching Name ${CLUSTER_NAME}-vpc: $VPCS"

          if [ "$COUNT" -gt 1 ]; then
            echo "🚨 Duplicate VPCs detected for ${CLUSTER_NAME}-vpc."
            echo "❌ Failing fast to prevent further duplication. Please clean up the older VPC or import it into state."
            exit 1
          fi

          if [ "$COUNT" -eq 1 ]; then
            echo "ℹ️ One existing VPC found; conflict handler/import will reconcile state if needed."
          else
            echo "ℹ️ No existing VPC found; Terraform may create it."
          fi

      - name: "Decide EKS Create/Preserve (safe: never destroy control plane)"
        working-directory: ${{ env.TERRAFORM_PATH }}/environments/dev
        run: |
          set -e
          CLUSTER_NAME="healthcare-eks-stage3-dev"
          REGION="${AWS_REGION:-us-east-1}"
          echo "🔎 Detecting EKS cluster existence..."
          if aws eks describe-cluster --name "$CLUSTER_NAME" --region "$REGION" >/dev/null 2>&1; then
            echo "✅ EKS cluster exists"
          else
            echo "📋 EKS cluster missing; will CREATE"
          fi
          # IMPORTANT: Keep Terraform managing the cluster to avoid accidental destroy
          # In our module: create = var.preserve_existing_cluster ? false : true
          # To ensure 'create=true', we must set preserve_existing_cluster=false always
          echo "TF_VAR_preserve_existing_cluster=false" >> $GITHUB_ENV


      - name: Persist EKS decision to tfvars
        working-directory: ${{ env.TERRAFORM_PATH }}/environments/dev
        run: |
          echo "preserve_existing_cluster=false" > terraform.tfvars
          echo "📄 terraform.tfvars contents:" && cat terraform.tfvars

      - name: Terraform Plan
        working-directory: ${{ env.TERRAFORM_PATH }}/environments/dev
        run: |
          echo "📋 Planning infrastructure deployment..."
          terraform plan -var="preserve_existing_cluster=${TF_VAR_preserve_existing_cluster}" -out=tfplan

          # Show plan summary
          terraform show -no-color tfplan | head -50

      - name: Safety Guard - Validate Plan
        working-directory: ${{ env.TERRAFORM_PATH }}/environments/dev
        run: |
          echo "🛡️ Running safety guard to prevent mass resource creation..."

          # Parse terraform plan to count creates
          CREATE_COUNT=$(terraform show -json tfplan | jq -r '.resource_changes[]? | select(.change.actions[]? == "create") | .address' | wc -l)
          UPDATE_COUNT=$(terraform show -json tfplan | jq -r '.resource_changes[]? | select(.change.actions[]? == "update") | .address' | wc -l)
          DELETE_COUNT=$(terraform show -json tfplan | jq -r '.resource_changes[]? | select(.change.actions[]? == "delete") | .address' | wc -l)

          echo "📊 Terraform Plan Analysis:"
          echo "   Resources to CREATE: $CREATE_COUNT"
          echo "   Resources to UPDATE: $UPDATE_COUNT"
          echo "   Resources to DELETE: $DELETE_COUNT"

          # Safety threshold (can be overridden via repository variable)
          SAFETY_THRESHOLD="${{ vars.TERRAFORM_CREATE_THRESHOLD || '5' }}"
          FORCE_APPLY="${{ vars.FORCE_TERRAFORM_APPLY || 'false' }}"

          echo "🎯 Safety threshold: $SAFETY_THRESHOLD creates"
          echo "🔧 Force apply override: $FORCE_APPLY"

          # Check if we're creating too many resources
          if [[ "$CREATE_COUNT" -gt "$SAFETY_THRESHOLD" ]] && [[ "$FORCE_APPLY" != "true" ]]; then
            echo "🚨 SAFETY GUARD TRIGGERED!"
            echo "❌ Plan shows $CREATE_COUNT resources to be created, which exceeds threshold of $SAFETY_THRESHOLD"
            echo ""
            echo "📋 Resources to be created:"
            terraform show -json tfplan | jq -r '.resource_changes[]? | select(.change.actions[]? == "create") | .address'
            echo ""
            echo "🛡️ This could indicate duplicate resource creation or unintended mass deployment."
            echo "🔧 To override this safety check, set repository variable FORCE_TERRAFORM_APPLY=true"
            echo "⚙️ To adjust threshold, set repository variable TERRAFORM_CREATE_THRESHOLD to desired number"
            echo ""
            echo "💡 Recommended actions:"
            echo "   1. Review the plan carefully for duplicate resources"
            echo "   2. Check if existing resources should be imported instead"
            echo "   3. Verify this is an intentional fresh deployment"
            exit 1
          else
            echo "✅ Safety guard passed - proceeding with deployment"
            if [[ "$CREATE_COUNT" -gt 0 ]]; then
              echo "📋 Resources that will be created:"
              terraform show -json tfplan | jq -r '.resource_changes[]? | select(.change.actions[]? == "create") | .address'
            fi
          fi

      - name: Handle Infrastructure Conflicts
        working-directory: ${{ env.TERRAFORM_PATH }}/environments/dev
        run: |
          echo "🔍 Handling potential infrastructure conflicts..."

          # Make script executable and source it
          chmod +x ../../../scripts/deployment/handle-infrastructure-conflicts.sh
          source ../../../scripts/deployment/handle-infrastructure-conflicts.sh

          # Use import strategy by default (can be overridden with repository variable)
          CONFLICT_STRATEGY="${{ vars.INFRASTRUCTURE_CONFLICT_STRATEGY || 'import' }}"

          # Import existing VPC networking into state before plan/apply
          import_vpc_networking || true

          # Handle conflicts based on strategy (includes enhanced pre-imports)
          handle_infrastructure_conflicts "$CONFLICT_STRATEGY"


      - name: Terraform Plan (Post-Import)
        working-directory: ${{ env.TERRAFORM_PATH }}/environments/dev
        run: |
          echo "📋 Re-planning infrastructure after imports/conflict handling..."
          terraform plan -var="preserve_existing_cluster=${TF_VAR_preserve_existing_cluster}" -out=tfplan
          echo "📋 Plan summary (post-import):"
          terraform show -no-color tfplan | head -50

      - name: Safety Guard - Validate Plan (Post-Import)
        working-directory: ${{ env.TERRAFORM_PATH }}/environments/dev
        run: |
          echo "🛡️ Running safety guard (post-import) to prevent mass resource creation..."

          CREATE_COUNT=$(terraform show -json tfplan | jq -r '.resource_changes[]? | select(.change.actions[]? == "create") | .address' | wc -l)
          UPDATE_COUNT=$(terraform show -json tfplan | jq -r '.resource_changes[]? | select(.change.actions[]? == "update") | .address' | wc -l)
          DELETE_COUNT=$(terraform show -json tfplan | jq -r '.resource_changes[]? | select(.change.actions[]? == "delete") | .address' | wc -l)

          echo "📊 Terraform Plan Analysis (Post-Import):"
          echo "   Resources to CREATE: $CREATE_COUNT"
          echo "   Resources to UPDATE: $UPDATE_COUNT"
          echo "   Resources to DELETE: $DELETE_COUNT"

          SAFETY_THRESHOLD="${{ vars.TERRAFORM_CREATE_THRESHOLD || '5' }}"
          FORCE_APPLY="${{ vars.FORCE_TERRAFORM_APPLY || 'false' }}"

          echo "🎯 Safety threshold: $SAFETY_THRESHOLD creates"
          echo "🔧 Force apply override: $FORCE_APPLY"

          if [[ "$CREATE_COUNT" -gt "$SAFETY_THRESHOLD" ]] && [[ "$FORCE_APPLY" != "true" ]]; then
            echo "🚨 SAFETY GUARD TRIGGERED (post-import)!"
            echo "❌ Plan shows $CREATE_COUNT resources to be created, which exceeds threshold of $SAFETY_THRESHOLD"
            echo "📋 Resources to be created:"
            terraform show -json tfplan | jq -r '.resource_changes[]? | select(.change.actions[]? == "create") | .address'
            exit 1
          else
            echo "✅ Safety guard passed (post-import) - proceeding to apply"
          fi

      - name: Terraform Apply
        working-directory: ${{ env.TERRAFORM_PATH }}/environments/dev
        run: |
          echo "🚀 Deploying infrastructure with conflict resolution..."

          # Show what will be created/updated based on existing infrastructure
          if [[ "${{ steps.infra-check.outputs.cluster-exists }}" == "true" ]]; then
            echo "✅ EKS cluster exists - Terraform will manage existing resource"
          else
            echo "📋 EKS cluster will be created"
          fi

          if [[ "${{ steps.infra-check.outputs.rds-exists }}" == "true" ]]; then
            echo "✅ RDS instance exists - Terraform will manage existing resource"
          else
            echo "📋 RDS instance will be created"
          fi

          if [[ "${{ steps.infra-check.outputs.vpc-exists }}" == "true" ]]; then
            echo "✅ VPC exists - Terraform will manage existing resource"
          else
            echo "📋 VPC and networking will be created (single NAT Gateway)"
          fi

          echo ""
          echo "🔧 Applying Terraform plan with conflict resolution..."

          # Apply with auto-approval for CI/CD
          terraform apply -auto-approve tfplan

          echo "✅ Infrastructure deployment completed with conflict resolution"

      - name: Validate Infrastructure
        working-directory: ${{ env.TERRAFORM_PATH }}/environments/dev
        run: |
          echo "🔍 Validating deployed infrastructure..."

          # Check if outputs exist first
          echo "📋 Available Terraform outputs:"
          terraform output

          # Get outputs with proper error handling
          if terraform output cluster_id >/dev/null 2>&1; then
            EKS_CLUSTER_ID=$(terraform output -raw cluster_id)
            echo "EKS Cluster ID: $EKS_CLUSTER_ID"
          else
            echo "⚠️ cluster_id output not found"
          fi

          if terraform output cluster_endpoint >/dev/null 2>&1; then
            EKS_CLUSTER_ENDPOINT=$(terraform output -raw cluster_endpoint)
            echo "EKS Cluster Endpoint: $EKS_CLUSTER_ENDPOINT"
          else
            echo "⚠️ cluster_endpoint output not found"
          fi

          if terraform output db_instance_endpoint >/dev/null 2>&1; then
            RDS_ENDPOINT=$(terraform output -raw db_instance_endpoint)
            echo "RDS Endpoint: $RDS_ENDPOINT"
          else
            echo "⚠️ db_instance_endpoint output not found"
          fi

          # Resolve cluster name from Terraform outputs if available
          CLUSTER_NAME="healthcare-eks-stage3-dev"
          if terraform output cluster_id >/dev/null 2>&1; then
            CANDIDATE=$(terraform output -raw cluster_id 2>/dev/null || echo "")
            if [ -n "$CANDIDATE" ] && [ "$CANDIDATE" != "null" ]; then
              CLUSTER_NAME="$CANDIDATE"
            fi
          fi
          echo "Using cluster name: $CLUSTER_NAME"

          echo "⏳ Waiting for EKS cluster ($CLUSTER_NAME) to be ACTIVE..."
          ATTEMPTS=70
          SLEEP_SECONDS=30
          STATUS="UNKNOWN"
          for i in $(seq 1 $ATTEMPTS); do
            STATUS=$(aws eks describe-cluster --name "$CLUSTER_NAME" --region ${{ env.AWS_REGION }} --query 'cluster.status' --output text 2>/dev/null || echo "NOT_FOUND")
            echo "Attempt $i/$ATTEMPTS - Cluster status: $STATUS"
            if [[ "$STATUS" == "ACTIVE" ]]; then
              echo "✅ EKS cluster exists and is ACTIVE"
              break
            fi
            sleep $SLEEP_SECONDS
          done

          if [[ "$STATUS" != "ACTIVE" ]]; then
            echo "❌ EKS cluster is not ACTIVE or not accessible"
            exit 1
          fi

          # Update kubeconfig and test connectivity
          aws eks update-kubeconfig --name "$CLUSTER_NAME" --region ${{ env.AWS_REGION }}
          echo "🔍 Testing cluster connectivity..."
          kubectl get nodes || echo "⚠️ Could not connect to cluster nodes"

          # Validate ECR repositories
          echo "🔍 Validating ECR repositories..."
          aws ecr describe-repositories --repository-names healthcare-frontend-stage3 --region ${{ env.AWS_REGION }} || echo "⚠️ Frontend ECR repository not found"
          aws ecr describe-repositories --repository-names healthcare-backend-stage3 --region ${{ env.AWS_REGION }} || echo "⚠️ Backend ECR repository not found"

          echo "✅ Infrastructure validation completed"

      - name: Drift Detection & State Consistency Check
        working-directory: ${{ env.TERRAFORM_PATH }}/environments/dev
        run: |
          echo "🔍 Running drift detection and state consistency check..."

          # Run terraform plan to detect any drift
          echo "📋 Checking for configuration drift..."
          terraform plan -detailed-exitcode -out=drift-check-plan || {
            EXIT_CODE=$?
            if [ $EXIT_CODE -eq 2 ]; then
              echo "⚠️ Configuration drift detected!"
              echo "📋 Drift details:"
              terraform show -no-color drift-check-plan | head -100

              # Count the changes
              CREATE_COUNT=$(terraform show -json drift-check-plan | jq -r '.resource_changes[]? | select(.change.actions[]? == "create") | .address' | wc -l)
              UPDATE_COUNT=$(terraform show -json drift-check-plan | jq -r '.resource_changes[]? | select(.change.actions[]? == "update") | .address' | wc -l)
              DELETE_COUNT=$(terraform show -json drift-check-plan | jq -r '.resource_changes[]? | select(.change.actions[]? == "delete") | .address' | wc -l)

              echo "📊 Drift Summary:"
              echo "   Resources to CREATE: $CREATE_COUNT"
              echo "   Resources to UPDATE: $UPDATE_COUNT"
              echo "   Resources to DELETE: $DELETE_COUNT"

              # If only updates (configuration drift), that's acceptable
              if [[ "$CREATE_COUNT" -eq 0 && "$DELETE_COUNT" -eq 0 ]]; then
                echo "✅ Only configuration updates detected - acceptable drift"
              else
                echo "❌ Structural changes detected - this indicates potential issues"
                echo "🔍 Resources with structural changes:"
                if [[ "$CREATE_COUNT" -gt 0 ]]; then
                  echo "   Creates:"
                  terraform show -json drift-check-plan | jq -r '.resource_changes[]? | select(.change.actions[]? == "create") | .address'
                fi
                if [[ "$DELETE_COUNT" -gt 0 ]]; then
                  echo "   Deletes:"
                  terraform show -json drift-check-plan | jq -r '.resource_changes[]? | select(.change.actions[]? == "delete") | .address'
                fi
                exit 1
              fi
            elif [ $EXIT_CODE -eq 1 ]; then
              echo "❌ Terraform plan failed"
              exit 1
            fi
          }

          if [ $? -eq 0 ]; then
            echo "✅ No configuration drift detected - infrastructure is in desired state"
          fi

          # Validate state file integrity
          echo "🔍 Validating Terraform state integrity..."
          terraform state list > /tmp/state_resources.txt
          RESOURCE_COUNT=$(wc -l < /tmp/state_resources.txt)
          echo "📊 Resources in state: $RESOURCE_COUNT"

          if [[ "$RESOURCE_COUNT" -lt 5 ]]; then
            echo "⚠️ Suspiciously low resource count in state - possible state corruption"
            echo "📋 Resources in state:"
            cat /tmp/state_resources.txt
          else
            echo "✅ State file appears healthy with $RESOURCE_COUNT resources"
          fi

          # Clean up temporary files
          rm -f drift-check-plan /tmp/state_resources.txt

          echo "✅ Drift detection and state consistency check completed"

  ansible-configuration:
    name: Ansible Configuration Management
    runs-on: ubuntu-latest
    needs: [deploy-infrastructure]
    if: github.ref == 'refs/heads/main' && (vars.ENABLE_ANSIBLE == 'true')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Python and Ansible
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Ansible and dependencies
        run: |
          echo "🔧 Installing Ansible and required collections..."
          pip install ansible boto3 botocore kubernetes

          # Install required Ansible collections
          ansible-galaxy collection install amazon.aws
          ansible-galaxy collection install kubernetes.core
          ansible-galaxy collection install community.postgresql

          echo "✅ Ansible installation completed"
          ansible --version

      - name: Setup kubectl for Ansible
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Get infrastructure outputs for Ansible
        working-directory: ${{ env.TERRAFORM_PATH }}/environments/dev
        run: |
          echo "📋 Gathering infrastructure information for Ansible..."

          # Get RDS endpoint
          RDS_ENDPOINT=""
          if terraform output db_instance_endpoint >/dev/null 2>&1; then
            RDS_ENDPOINT=$(terraform output -raw db_instance_endpoint 2>/dev/null || echo "")
          fi

          # Fallback to AWS CLI if Terraform output not available
          if [[ -z "$RDS_ENDPOINT" ]]; then
            RDS_ENDPOINT=$(aws rds describe-db-instances \
              --db-instance-identifier healthcare-eks-stage3-dev-db \
              --region ${{ env.AWS_REGION }} \
              --query 'DBInstances[0].Endpoint.Address' \
              --output text 2>/dev/null || echo "")
          fi

          # Get Cluster name from Terraform outputs if available
          CLUSTER_NAME="healthcare-eks-stage3-dev"
          if terraform output cluster_id >/dev/null 2>&1; then
            CLUSTER_NAME=$(terraform output -raw cluster_id 2>/dev/null || echo "healthcare-eks-stage3-dev")
          fi

          # Get AWS Account ID
          AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

          # Export for Ansible
          echo "RDS_ENDPOINT=$RDS_ENDPOINT" >> $GITHUB_ENV
          echo "AWS_ACCOUNT_ID=$AWS_ACCOUNT_ID" >> $GITHUB_ENV
          echo "CLUSTER_NAME=$CLUSTER_NAME" >> $GITHUB_ENV

          echo "📊 Infrastructure Information:"
          echo "   RDS Endpoint: $RDS_ENDPOINT"
          echo "   AWS Account ID: $AWS_ACCOUNT_ID"
          echo "   EKS Cluster Name: $CLUSTER_NAME"

      - name: Wait for EKS cluster to be ACTIVE
        run: |
          echo "⏳ Waiting for EKS cluster ($CLUSTER_NAME) to be ACTIVE..."
          ATTEMPTS=70
          SLEEP_SECONDS=30
          STATUS="UNKNOWN"
          for i in $(seq 1 $ATTEMPTS); do
            STATUS=$(aws eks describe-cluster --region ${{ env.AWS_REGION }} --name "$CLUSTER_NAME" --query 'cluster.status' --output text 2>/dev/null || echo "NOT_FOUND")
            echo "Attempt $i/$ATTEMPTS - Cluster status: $STATUS"
            if [[ "$STATUS" == "ACTIVE" ]]; then
              echo "✅ Cluster is ACTIVE"
              break
            fi
            sleep $SLEEP_SECONDS
          done
          if [[ "$STATUS" != "ACTIVE" ]]; then
            echo "❌ EKS cluster is not ACTIVE or not found"
            exit 1
          fi

      - name: Configure kubectl for EKS
        run: |
          echo "🔧 Configuring kubectl for Ansible operations..."
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name "$CLUSTER_NAME"

          # Verify cluster connectivity
          kubectl cluster-info
          kubectl get nodes

      - name: Get infrastructure outputs for Ansible
        working-directory: ${{ env.TERRAFORM_PATH }}/environments/dev
        run: |
          echo "📋 Gathering infrastructure information for Ansible..."

          # Get RDS endpoint
          RDS_ENDPOINT=""
          if terraform output db_instance_endpoint >/dev/null 2>&1; then
            RDS_ENDPOINT=$(terraform output -raw db_instance_endpoint 2>/dev/null || echo "")
          fi

          # Fallback to AWS CLI if Terraform output not available
          if [[ -z "$RDS_ENDPOINT" ]]; then
            RDS_ENDPOINT=$(aws rds describe-db-instances \
              --db-instance-identifier healthcare-eks-stage3-dev-db \
              --region ${{ env.AWS_REGION }} \
              --query 'DBInstances[0].Endpoint.Address' \
              --output text 2>/dev/null || echo "")
          fi

          # Get AWS Account ID
          AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

          # Export for Ansible
          echo "RDS_ENDPOINT=$RDS_ENDPOINT" >> $GITHUB_ENV
          echo "AWS_ACCOUNT_ID=$AWS_ACCOUNT_ID" >> $GITHUB_ENV

          echo "📊 Infrastructure Information:"
          echo "   RDS Endpoint: $RDS_ENDPOINT"
          echo "   AWS Account ID: $AWS_ACCOUNT_ID"

      - name: Run Database Configuration
        working-directory: ${{ env.SOURCE_CODE_PATH }}/ops/ansible
        run: |
          echo "🗄️ Running database configuration with Ansible..."

          # Set required environment variables
          export DB_PASSWORD="${{ secrets.DB_PASSWORD || 'healthcare_stage3_password_change_me' }}"
          export APP_DB_PASSWORD="${{ secrets.APP_DB_PASSWORD || 'healthcare_app_password_change_me' }}"
          export READONLY_DB_PASSWORD="${{ secrets.READONLY_DB_PASSWORD || 'readonly_password_change_me' }}"
          export BACKUP_DB_PASSWORD="${{ secrets.BACKUP_DB_PASSWORD || 'backup_password_change_me' }}"

          # Run database configuration playbook
          ansible-playbook -i inventory/ \
            playbooks/database-config.yml \
            -e environment=dev \
            -e aws_region=${{ env.AWS_REGION }} \
            -e aws_account_id=$AWS_ACCOUNT_ID \
            -e rds_endpoint=$RDS_ENDPOINT \
            -v

          echo "✅ Database configuration completed"

      - name: Run Security Hardening
        working-directory: ${{ env.SOURCE_CODE_PATH }}/ops/ansible
        run: |
          echo "🛡️ Running security hardening with Ansible..."

          # Run security hardening playbook
          ansible-playbook -i inventory/ \
            playbooks/security-hardening.yml \
            -e environment=dev \
            -e aws_region=${{ env.AWS_REGION }} \
            -e aws_account_id=$AWS_ACCOUNT_ID \
            -v

          echo "✅ Security hardening completed"

      - name: Run Monitoring Setup
        working-directory: ${{ env.SOURCE_CODE_PATH }}/ops/ansible
        run: |
          echo "📊 Setting up monitoring with Ansible..."

          # Set monitoring-specific environment variables
          export GRAFANA_ADMIN_PASSWORD="${{ secrets.GRAFANA_ADMIN_PASSWORD || 'admin123' }}"
          export GRAFANA_API_KEY="${{ secrets.GRAFANA_API_KEY || '' }}"
          export SECURITY_WEBHOOK_URL="${{ secrets.SECURITY_WEBHOOK_URL || '' }}"

          # Run monitoring setup playbook
          ansible-playbook -i inventory/ \
            playbooks/monitoring-setup.yml \
            -e environment=dev \
            -e aws_region=${{ env.AWS_REGION }} \
            -e aws_account_id=$AWS_ACCOUNT_ID \
            -v

          echo "✅ Monitoring setup completed"

      - name: Validate Ansible Configuration
        working-directory: ${{ env.SOURCE_CODE_PATH }}/ops/ansible
        run: |
          echo "🔍 Validating Ansible configuration results..."

          # Check database connectivity
          echo "Testing database connectivity..."
          kubectl get secret database-credentials-stage3 -n healthcare-stage3-dev >/dev/null 2>&1 && \
            echo "✅ Database credentials secret exists" || \
            echo "⚠️ Database credentials secret not found"

          # Check security configurations
          echo "Checking security configurations..."
          kubectl get networkpolicy -n healthcare-stage3-dev >/dev/null 2>&1 && \
            echo "✅ Network policies configured" || \
            echo "⚠️ Network policies not found"

          # Check monitoring setup
          echo "Checking monitoring setup..."
          kubectl get configmap prometheus-config -n monitoring >/dev/null 2>&1 && \
            echo "✅ Prometheus configuration exists" || \
            echo "⚠️ Prometheus configuration not found"

          echo "✅ Ansible configuration validation completed"

  deploy-application:
    name: Deploy Application with Automated Database Setup
    runs-on: ubuntu-latest
    needs: [deploy-infrastructure, setup-terraform-backend]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Fetch the latest changes including GitOps updates
          ref: main

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Configure kubectl for EKS
        working-directory: ${{ env.TERRAFORM_PATH }}/environments/dev
        run: |
          echo "🔧 Resolving cluster name from Terraform outputs..."
          CLUSTER_NAME="healthcare-eks-stage3-dev"
          if terraform output cluster_id >/dev/null 2>&1; then
            CANDIDATE=$(terraform output -raw cluster_id 2>/dev/null || echo "")
            if [ -n "$CANDIDATE" ] && [ "$CANDIDATE" != "null" ]; then
              CLUSTER_NAME="$CANDIDATE"
            fi
          fi
          echo "Using cluster: $CLUSTER_NAME"

          echo "⏳ Waiting for EKS cluster ($CLUSTER_NAME) to be ACTIVE..."
          ATTEMPTS=70
          SLEEP_SECONDS=30
          STATUS="UNKNOWN"
          for i in $(seq 1 $ATTEMPTS); do
            STATUS=$(aws eks describe-cluster --region ${{ env.AWS_REGION }} --name "$CLUSTER_NAME" --query 'cluster.status' --output text 2>/dev/null || echo "NOT_FOUND")
            echo "Attempt $i/$ATTEMPTS - Cluster status: $STATUS"
            if [[ "$STATUS" == "ACTIVE" ]]; then
              echo "✅ Cluster is ACTIVE"
              break
            fi
            sleep $SLEEP_SECONDS
          done
          if [[ "$STATUS" != "ACTIVE" ]]; then
            echo "❌ EKS cluster is not ACTIVE or not found"
            exit 1
          fi

          echo "🔧 Configuring kubectl for EKS cluster..."
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name "$CLUSTER_NAME"

          # Verify cluster connectivity
          echo "🔍 Verifying cluster connectivity..."
          kubectl cluster-info
          kubectl get nodes

          # List existing namespaces
          echo "📋 Current namespaces:"
          kubectl get namespaces

      - name: Setup Terraform (for database config script)
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Ensure jq is installed
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y jq
          fi

      - name: Install eksctl for AWS Load Balancer Controller
        run: |
          echo "🔧 Installing eksctl for AWS Load Balancer Controller..."

          # Install eksctl
          curl --silent --location "https://github.com/weaveworks/eksctl/releases/latest/download/eksctl_$(uname -s)_amd64.tar.gz" | tar xz -C /tmp
          sudo mv /tmp/eksctl /usr/local/bin
          eksctl version

      - name: Install AWS Load Balancer Controller for ALB support
        run: |
          echo "🔧 Installing AWS Load Balancer Controller for Application Load Balancer support..."
          cd Project-Stages/Project-Stage-3-Advanced-DevOps-Pipeline


          # Ensure eksctl is available for IRSA creation
          echo "🔧 Installing eksctl..."
          curl -sL "https://github.com/eksctl-io/eksctl/releases/latest/download/eksctl_$(uname -s)_amd64.tar.gz" | tar xz -C /tmp
          sudo mv /tmp/eksctl /usr/local/bin
          eksctl version

          # Install AWS Load Balancer Controller
          chmod +x scripts/deployment/install-aws-load-balancer-controller.sh
          ./scripts/deployment/install-aws-load-balancer-controller.sh healthcare-eks-stage3-dev

          echo "✅ AWS Load Balancer Controller installed - ALB support ready"

      - name: Validate Terraform State and Outputs
        working-directory: ${{ env.TERRAFORM_PATH }}/environments/dev
        run: |
          echo "🔍 Validating Terraform state and outputs before database setup..."

          # Always ensure Terraform is initialized in this job context (idempotent)
          echo "🔧 Initializing Terraform with S3 backend (safe, idempotent)..."
          terraform init -reconfigure -input=false -no-color \
            -backend-config="bucket=${{ needs.setup-terraform-backend.outputs.backend-bucket }}" \
            -backend-config="key=stage3/dev/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ needs.setup-terraform-backend.outputs.backend-table }}" \
            -backend-config="encrypt=true" || true

          # Check if terraform state exists and is accessible
          if terraform state list >/dev/null 2>&1; then
            echo "✅ Terraform state is accessible"

            # List all available outputs
            echo "📋 Available Terraform outputs:"
            terraform output 2>/dev/null || echo "No outputs available"

            # Specifically check for required outputs
            if terraform output db_instance_endpoint >/dev/null 2>&1; then
              RDS_ENDPOINT=$(terraform output -raw db_instance_endpoint 2>/dev/null || echo "")
              if [[ -n "$RDS_ENDPOINT" && "$RDS_ENDPOINT" =~ \.rds\.amazonaws\.com$ ]]; then
                echo "✅ Valid RDS endpoint output found: $RDS_ENDPOINT"
              else
                echo "⚠️ RDS endpoint output exists but is invalid: '$RDS_ENDPOINT'"
                echo "Will fall back to AWS CLI discovery"
              fi
            else
              echo "⚠️ db_instance_endpoint output not found - will use AWS CLI fallback"
            fi
          else
            echo "⚠️ Terraform state is not accessible or not initialized"
            echo "🔧 Running 'terraform init' before refresh attempt..."
            terraform init -input=false -no-color -reconfigure || true
            echo "🔄 Attempting to refresh state (apply -refresh-only)..."
            terraform apply -refresh-only -auto-approve || echo "State refresh failed - will use AWS CLI fallback"
          fi


      - name: Install and Bootstrap ArgoCD and Observability (idempotent)
        run: |
          set -e
          echo "🔧 Ensuring ArgoCD installed..."
          if ! kubectl get ns argocd >/dev/null 2>&1; then
            kubectl create namespace argocd
          fi
          if ! kubectl get deploy argocd-server -n argocd >/dev/null 2>&1; then
            kubectl apply -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
          fi
          echo "⏳ Waiting for ArgoCD server..."
          kubectl rollout status deploy/argocd-server -n argocd --timeout=600s || true

          echo "📦 Applying ArgoCD Project and Observability Applications..."
          # Apply AppProject
          if [ -f Project-Stages/Project-Stage-3-Advanced-DevOps-Pipeline/gitops/projects/healthcare-stage3.yaml ]; then
            kubectl apply -f Project-Stages/Project-Stage-3-Advanced-DevOps-Pipeline/gitops/projects/healthcare-stage3.yaml
          fi

          # Ensure monitoring and logging namespaces (needed for Secrets)
          kubectl create namespace monitoring --dry-run=client -o yaml | kubectl apply -f -
          kubectl create namespace logging --dry-run=client -o yaml | kubectl apply -f -

          # Create Grafana admin secret if missing
          if ! kubectl get secret grafana-admin -n monitoring >/dev/null 2>&1; then
            kubectl apply -f - <<'EOF'
          apiVersion: v1
          kind: Secret
          metadata:
            name: grafana-admin
            namespace: monitoring
          stringData:
            admin-user: admin
            admin-password: ${GRAFANA_ADMIN_PASSWORD:-admin123}
          EOF
          fi

          # Apply parent Applications for observability
          kubectl apply -f Project-Stages/Project-Stage-3-Advanced-DevOps-Pipeline/gitops/applications/observability-monitoring.yaml
          kubectl apply -f Project-Stages/Project-Stage-3-Advanced-DevOps-Pipeline/gitops/applications/observability-logging.yaml

          echo "⏳ Waiting for monitoring pods to start..."
          kubectl get pods -n monitoring || true
        env:
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD || 'admin123' }}






      - name: Deploy application with latest GitOps manifests
        working-directory: Project-Stages/Project-Stage-3-Advanced-DevOps-Pipeline/gitops/environments/dev
        run: |
          echo "🚀 Deploying application with automated database setup..."
          echo "Using GitOps manifests with image tag: ${{ github.sha }}"

          # Ensure namespace exists BEFORE updating secret
          echo "🏗️ Ensuring namespace exists..."
          # Method 1: Try declarative approach
          if kubectl create namespace healthcare-stage3-dev --dry-run=client -o yaml | kubectl apply -f -; then
            echo "✅ Namespace created/verified using declarative approach"
          else
            echo "⚠️ Declarative approach failed, trying imperative approach..."
            # Method 2: Try imperative approach
            if kubectl create namespace healthcare-stage3-dev 2>/dev/null; then
              echo "✅ Namespace created using imperative approach"
            else
              echo "ℹ️ Namespace might already exist, checking..."
            fi
          fi
          # Verify namespace exists
          if kubectl get namespace healthcare-stage3-dev >/dev/null 2>&1; then
            echo "✅ Namespace healthcare-stage3-dev is ready"
            kubectl describe namespace healthcare-stage3-dev
          else
            echo "❌ Failed to create or find namespace healthcare-stage3-dev"
            echo "🔍 Available namespaces:"
            kubectl get namespaces
            exit 1
          fi

          # Use dedicated script for database configuration update (cluster mode)
          echo "🔧 Running automated database configuration update (cluster mode)..."
          cd ../../../
          chmod +x scripts/deployment/update-database-config.sh
          export AWS_REGION=${{ env.AWS_REGION }}
          export RDS_ENDPOINT_OVERRIDE=$(aws rds describe-db-instances \
            --db-instance-identifier healthcare-eks-stage3-dev-db \
            --region $AWS_REGION \
            --query 'DBInstances[0].Endpoint.Address' \
            --output text 2>/dev/null || echo "")
          if [[ -n "$RDS_ENDPOINT_OVERRIDE" && "$RDS_ENDPOINT_OVERRIDE" == *".rds.amazonaws.com" ]]; then
            echo "✅ Using RDS endpoint override: $RDS_ENDPOINT_OVERRIDE"
          else
            echo "ℹ️ No RDS endpoint override available; script will fall back internally"
            unset RDS_ENDPOINT_OVERRIDE || true
          fi
          ./scripts/deployment/update-database-config.sh cluster

          # Restart backend to pick up updated Secret
          echo "🔄 Restarting backend deployment to pick up updated DATABASE_URL..."
          kubectl rollout restart deployment/healthcare-backend-stage3 -n healthcare-stage3-dev || echo "Backend deployment not found yet"
          echo "⏳ Waiting for backend rollout to complete..."
          kubectl rollout status deployment/healthcare-backend-stage3 -n healthcare-stage3-dev --timeout=600s || echo "Rollout timeout, continuing..."

          # Return to GitOps directory
          cd gitops/environments/dev

          # Apply all manifests with error handling
          echo "📦 Deploying backend application..."
          if kubectl apply -f backend.yaml; then
            echo "✅ Backend deployment successful"
          else
            echo "❌ Backend deployment failed"
            echo "🔍 Debugging information:"
            kubectl get namespaces
            kubectl describe namespace healthcare-stage3-dev || echo "Namespace does not exist"
            exit 1
          fi

          echo "🌐 Deploying frontend application..."
          if kubectl apply -f frontend.yaml; then
            echo "✅ Frontend deployment successful"
          else
            echo "❌ Frontend deployment failed"
            echo "🔍 Debugging information:"
            kubectl get namespaces
            kubectl describe namespace healthcare-stage3-dev || echo "Namespace does not exist"
            exit 1
          fi

          echo "🌐 Deploying ingress (ALB) ..."
          if kubectl apply -f ingress.yaml; then
            echo "✅ Main application ingress applied"
          else
            echo "❌ Main ingress apply failed"
            kubectl describe ingress healthcare-stage3-ingress -n healthcare-stage3-dev || true
            exit 1
          fi

          echo "📊 Deploying Grafana ingress (ALB) ..."
          if kubectl apply -f grafana-ingress.yaml; then
            echo "✅ Grafana ingress applied"
          else
            echo "❌ Grafana ingress apply failed"
            kubectl describe ingress grafana-stage3-ingress -n monitoring || true
            echo "⚠️ Continuing without Grafana ingress"
          fi

          echo "✅ Application deployment initiated"
          echo "🗄️ Database migrations and seeding will run automatically in backend pods"

          # Verify deployments were created
          echo "🔍 Verifying deployments..."
          kubectl get deployments -n healthcare-stage3-dev
          kubectl get pods -n healthcare-stage3-dev

          # Quick Secret visibility (non-fatal)
          echo "🔐 Checking database Secret configuration..."
          kubectl get secret database-credentials-stage3 -n healthcare-stage3-dev >/dev/null 2>&1 && \
            kubectl get secret database-credentials-stage3 -n healthcare-stage3-dev -o jsonpath='{.data.host}' | base64 -d || \
            echo "(Secret not found)"

      - name: Wait for deployment rollout
        run: |
          echo "⏳ Waiting for deployments to complete..."
          kubectl rollout status deployment/healthcare-backend-stage3 -n healthcare-stage3-dev --timeout=600s
          kubectl rollout status deployment/healthcare-frontend-stage3 -n healthcare-stage3-dev --timeout=600s

      - name: Run database migrations and seeding
        run: |
          echo "🗄️ Running database migrations and seeding..."

          # Wait for backend pods to be ready
          echo "⏳ Waiting for backend pods to be ready (up to 10 minutes)..."
          if ! kubectl wait --for=condition=ready pod -l app=healthcare-backend-stage3 -n healthcare-stage3-dev --timeout=600s; then
            echo "⚠️ Backend pods did not become Ready within timeout. Collecting diagnostics..."
            kubectl get pods -n healthcare-stage3-dev -l app=healthcare-backend-stage3 -o wide || true
            echo "🔍 Describing one backend pod for details..."
            ONE_POD=$(kubectl get pods -n healthcare-stage3-dev -l app=healthcare-backend-stage3 -o jsonpath='{.items[0].metadata.name}' || echo "")
            if [[ -n "$ONE_POD" ]]; then
              kubectl describe pod "$ONE_POD" -n healthcare-stage3-dev || true
              echo "🧾 Last 100 lines of pod logs (if available):"
              kubectl logs "$ONE_POD" -n healthcare-stage3-dev --tail=100 || true
            fi
            echo "Continuing to attempt migrations anyway..."
          fi

          # Get a backend pod name (prefer Ready pod if possible)
          BACKEND_POD=$(kubectl get pods -n healthcare-stage3-dev -l app=healthcare-backend-stage3 -o jsonpath='{.items[?(@.status.containerStatuses[0].ready==true)].metadata.name}' | awk '{print $1}')
          if [[ -z "$BACKEND_POD" ]]; then
            BACKEND_POD=$(kubectl get pods -n healthcare-stage3-dev -l app=healthcare-backend-stage3 -o jsonpath='{.items[0].metadata.name}')
          fi
          echo "📦 Using backend pod: $BACKEND_POD"

          # Verify database connection first
          echo "🔍 Verifying database connection..."
          kubectl exec -n healthcare-stage3-dev "$BACKEND_POD" -- env | grep DATABASE_URL || echo "DATABASE_URL not found"

          # Run database migrations
          echo "🔄 Running Prisma migrations..."
          kubectl exec -n healthcare-stage3-dev "$BACKEND_POD" -- npx prisma migrate deploy || {
            echo "⚠️ Migration failed, trying to push schema..."
            kubectl exec -n healthcare-stage3-dev "$BACKEND_POD" -- npx prisma db push --force-reset || echo "Schema push failed"
          }

          # Generate Prisma client
          echo "🔧 Generating Prisma client..."
          kubectl exec -n healthcare-stage3-dev "$BACKEND_POD" -- npx prisma generate || echo "Client generation failed"

          # Run database seeding
          echo "🌱 Running database seeding..."
          kubectl exec -n healthcare-stage3-dev "$BACKEND_POD" -- npm run seed || {
            echo "⚠️ Seeding failed, trying alternative approach..."
            kubectl exec -n healthcare-stage3-dev "$BACKEND_POD" -- node -e "
              const { PrismaClient } = require('@prisma/client');
              const prisma = new PrismaClient();

              async function seed() {
                console.log('🌱 Starting database seeding...');

                // Create sample doctors
                const doctors = await prisma.doctor.createMany({
                  data: [
                    {
                      name: 'Dr. John Smith',
                      specialization: 'Cardiology',
                      email: 'john.smith@healthcare.com',
                      phone: '+1-555-0101'
                    },
                    {
                      name: 'Dr. Sarah Johnson',
                      specialization: 'Pediatrics',
                      email: 'sarah.johnson@healthcare.com',
                      phone: '+1-555-0102'
                    },
                    {
                      name: 'Dr. Michael Brown',
                      specialization: 'Orthopedics',
                      email: 'michael.brown@healthcare.com',
                      phone: '+1-555-0103'
                    }
                  ],
                  skipDuplicates: true
                });

                console.log(\`✅ Created \${doctors.count} doctors\`);
                console.log('🎉 Database seeding completed!');
              }

              seed().catch(console.error).finally(() => prisma.\$disconnect());
            " || echo "Manual seeding failed"
          }

          # Verify seeding worked
          echo "🔍 Verifying database seeding..."
          kubectl exec -n healthcare-stage3-dev "$BACKEND_POD" -- node -e "
            const { PrismaClient } = require('@prisma/client');
            const prisma = new PrismaClient();

            async function verify() {
              const doctorCount = await prisma.doctor.count();
              console.log(\`📊 Total doctors in database: \${doctorCount}\`);

              if (doctorCount > 0) {
                const doctors = await prisma.doctor.findMany({ take: 3 });
                console.log('👨‍⚕️ Sample doctors:');
                doctors.forEach(doc => console.log(\`  - \${doc.name} (\${doc.specialization})\`));
                console.log('✅ Database verification successful!');
              } else {
                console.log('❌ No doctors found in database');
                process.exit(1);
              }
            }

            verify().catch(console.error).finally(() => prisma.\$disconnect());
          " || echo "Database verification failed"

          echo "✅ Database migrations and seeding completed!"
          echo "✅ Deployments completed successfully"

      - name: "Guard: Skip rebuild if infra healthy"
        id: guard
        run: |
          echo "🔍 Guard check: verifying infra health..."
          set -e
          CLUSTER=healthcare-eks-stage3-dev
          NS=healthcare-stage3-dev
          REGION=${{ env.AWS_REGION }}
          SHOULD_REBUILD=false

          # Cluster exists?
          if ! aws eks describe-cluster --name "$CLUSTER" --region "$REGION" >/dev/null 2>&1; then
            echo "ℹ️ EKS cluster missing"; SHOULD_REBUILD=true
          fi

          # If cluster exists, attempt ALB controller health
          if [[ "$SHOULD_REBUILD" == "false" ]]; then
            if kubectl get deploy aws-load-balancer-controller -n kube-system >/dev/null 2>&1; then
              READY=$(kubectl get deploy aws-load-balancer-controller -n kube-system -o jsonpath='{.status.readyReplicas}' 2>/dev/null || echo "0")
              if [[ -z "$READY" || "$READY" == "0" ]]; then
                echo "⚠️ ALB controller not ready"; SHOULD_REBUILD=true
              else
                # Scan for AccessDenied in recent logs
                if kubectl logs deploy/aws-load-balancer-controller -n kube-system --since=15m | grep -qi "AccessDenied"; then
                  echo "⚠️ Detected AccessDenied in ALB controller logs"; SHOULD_REBUILD=true
                fi
              fi
            else
              echo "ℹ️ ALB controller deployment missing"; SHOULD_REBUILD=true
            fi
          fi

          echo "rebuild=$SHOULD_REBUILD" >> $GITHUB_OUTPUT

      - name: Rebuild Stage-3 (idempotent)
        if: steps.guard.outputs.rebuild == 'true'
        working-directory: Project-Stages/Project-Stage-3-Advanced-DevOps-Pipeline
        run: |
          echo "🔄 Rebuilding Stage-3 (idempotent)..."
          chmod +x scripts/deployment/rebuild-stage3.sh
          ./scripts/deployment/rebuild-stage3.sh --ci





      - name: Automated database migration and seeding (idempotent)
        run: |
          echo "🌱 Ensuring database is migrated and seeded (idempotent)..."

          # Ensure backend is ready
          kubectl rollout status deployment/healthcare-backend-stage3 -n healthcare-stage3-dev --timeout=600s

          # Pick a backend pod
          BACKEND_POD=$(kubectl get pods -n healthcare-stage3-dev -l app=healthcare-backend-stage3 -o jsonpath='{.items[0].metadata.name}')
          echo "Using pod: $BACKEND_POD"

          echo "🔍 Checking current doctors count..."
          DOCTOR_COUNT=$(kubectl exec -n healthcare-stage3-dev "$BACKEND_POD" -- node -e '
            const { PrismaClient } = require("@prisma/client");
            const prisma = new PrismaClient();
            (async () => {
              const count = await prisma.doctor.count();
              console.log(count);
              await prisma.$disconnect();
            })().catch(e => { console.error(e.message || e); process.exit(2); });
          ' 2>/dev/null | tail -n1)

          echo "Current doctors count: ${DOCTOR_COUNT:-unknown}"

          if [[ -z "$DOCTOR_COUNT" || "$DOCTOR_COUNT" == "0" ]]; then
            echo "🌱 Seeding sample doctors..."
            kubectl exec -n healthcare-stage3-dev "$BACKEND_POD" -- node -e '
              const { PrismaClient } = require("@prisma/client");
              const prisma = new PrismaClient();
              (async () => {
                // Ensure base departments exist
                const departments = [
                  { name: "Cardiology", code: "CARD", description: "Heart and cardiovascular system" },
                  { name: "Pulmonology", code: "PULM", description: "Respiratory system" },
                  { name: "Orthopedics", code: "ORTH", description: "Bones, joints, and muscles" }
                ];
                const deptMap = {};
                for (const d of departments) {
                  const dep = await prisma.department.upsert({
                    where: { code: d.code },
                    update: {},
                    create: d
                  });
                  deptMap[d.code] = dep.id;
                }

                // Seed doctors aligned with schema (firstName/lastName/departmentId)
                await prisma.doctor.createMany({
                  data: [
                    { firstName: "John", lastName: "Smith", email: "john.smith@hospital.com", specialization: "Cardiology", departmentId: deptMap["CARD"], qualifications: ["MD", "FACC"], experienceYears: 10, consultationFee: 200.0 },
                    { firstName: "Sarah", lastName: "Johnson", email: "sarah.johnson@hospital.com", specialization: "Pulmonology", departmentId: deptMap["PULM"], qualifications: ["MD", "FCCP"], experienceYears: 8, consultationFee: 180.0 },
                    { firstName: "Michael", lastName: "Brown", email: "michael.brown@hospital.com", specialization: "Orthopedics", departmentId: deptMap["ORTH"], qualifications: ["MD"], experienceYears: 12, consultationFee: 220.0 }
                  ],
                  skipDuplicates: true
                });

                const count = await prisma.doctor.count();
                console.log("Seeded doctors count:", count);
                await prisma.$disconnect();
              })().catch(e => { console.error(e.message || e); process.exit(2); });
            '

            echo "🔍 Verifying doctors count after seeding..."
            DOCTOR_COUNT=$(kubectl exec -n healthcare-stage3-dev "$BACKEND_POD" -- node -e '
              const { PrismaClient } = require("@prisma/client");
              const prisma = new PrismaClient();
              (async () => {
                const count = await prisma.doctor.count();
                console.log(count);
                await prisma.$disconnect();
              })().catch(e => { console.error(e.message || e); process.exit(2); });
            ' 2>/dev/null | tail -n1)
            echo "Doctors count after seeding: ${DOCTOR_COUNT:-unknown}"

            if [[ -z "$DOCTOR_COUNT" || "$DOCTOR_COUNT" == "0" ]]; then
              echo "❌ Seeding did not produce sample data"
              exit 1
            fi
          else
            echo "✅ Sample data already present; skipping seeding"
          fi

      - name: Validate automated database setup
        run: |
          echo "🔍 Validating automated database setup..."

          # Get Application Load Balancer URL from Ingress
          echo "🔍 Getting Application Load Balancer URL from Ingress..."

          # Wait for Ingress to get ALB address
          for i in {1..20}; do
            ALB_URL=$(kubectl get ingress healthcare-stage3-ingress -n healthcare-stage3-dev -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "")
            if [[ -n "$ALB_URL" ]]; then
              echo "✅ Application Load Balancer URL found: http://$ALB_URL"
              break
            else
              echo "⏳ Waiting for ALB to be provisioned... (attempt $i/20)"
              sleep 30
            fi
          done

          if [[ -z "$ALB_URL" ]]; then
            echo "❌ Application Load Balancer URL not found after 10 minutes"
            echo "🔍 Checking Ingress status..."
            kubectl describe ingress healthcare-stage3-ingress -n healthcare-stage3-dev || true
            echo "🔍 Checking AWS Load Balancer Controller logs..."
            kubectl logs deployment/aws-load-balancer-controller -n kube-system --tail=50 || echo "Controller logs not available"

            # Fallback: try to get any ALB in the region and use its DNS as LB_URL
            echo "🔍 Checking for any ALBs in the region..."
            FALLBACK_ALB=$(aws elbv2 describe-load-balancers --region us-east-1 --query 'LoadBalancers[?Type==`application`].[DNSName]' --output text | head -n1 || true)
            if [[ -n "$FALLBACK_ALB" ]]; then
              LB_URL="$FALLBACK_ALB"
              echo "ℹ️ Using fallback ALB DNS: http://$LB_URL"
            else
              echo "❌ No ALBs found via fallback"
              exit 1
            fi
          else
            LB_URL="$ALB_URL"
          fi

          echo "🔗 Using Application Load Balancer: http://$LB_URL"

          # Ensure LB_URL is set only once
          :

          # Check pod status first
          echo "🔍 Checking pod status..."
          kubectl get pods -n healthcare-stage3-dev
          kubectl describe pods -n healthcare-stage3-dev

          # Check backend logs for errors
          echo "📋 Checking backend logs..."
          kubectl logs deployment/healthcare-backend-stage3 -n healthcare-stage3-dev --tail=50 || echo "Could not get backend logs"

          # Extra wait for DNS propagation of ALB hostname
          echo "⏳ Waiting for ALB DNS to resolve..."
          for i in {1..40}; do
            if getent hosts "$LB_URL" >/dev/null 2>&1; then
              echo "✅ DNS resolution successful for $LB_URL"
              break
            else
              echo "⏳ DNS not resolved yet (attempt $i/40). Waiting 15s..."
              sleep 15
            fi
          done

          if ! getent hosts "$LB_URL" >/dev/null 2>&1; then
            echo "❌ DNS still not resolving for $LB_URL after 10 minutes"
            echo "🔎 Ingress describe:" && kubectl describe ingress healthcare-stage3-ingress -n healthcare-stage3-dev || true
            exit 1
          fi

          # Test basic connectivity with retries
          echo "🌐 Testing basic connectivity (with retries)..."
          if curl -I "http://${LB_URL}" --connect-timeout 10 --max-time 20 --retry 12 --retry-delay 10 --retry-connrefused; then
            echo "✅ LoadBalancer is accessible"
          else
            echo "❌ LoadBalancer is not accessible after retries"
            exit 1
          fi

          # Test health endpoint with detailed output
          echo "🗄️ Testing health endpoint..."
          HEALTH_RESPONSE=$(curl -s "http://${LB_URL}/api/health" || echo "CURL_FAILED")
          echo "Health response: $HEALTH_RESPONSE"

          if echo "$HEALTH_RESPONSE" | jq -e '.database == "connected"' >/dev/null 2>&1; then
            echo "✅ Database connection successful"
          else
            echo "❌ Database connection failed or health endpoint not working"
            echo "🔍 Debugging backend issues..."
            echo "📋 Checking backend logs..."
            BACKEND_POD=$(kubectl get pods -n healthcare-stage3-dev -l app=healthcare-backend-stage3 -o jsonpath='{.items[0].metadata.name}')
            echo "Found 1 pod, using pod/$BACKEND_POD"
            kubectl logs "$BACKEND_POD" -n healthcare-stage3-dev --tail=200 || true
            exit 1
          fi

          # Test doctors endpoint with detailed debugging
          echo "👨‍⚕️ Testing doctors endpoint..."
          DOCTORS_RESPONSE=$(curl -s "http://${LB_URL}/api/doctors" || echo "CURL_FAILED")
          echo "Doctors response: $DOCTORS_RESPONSE"

          if echo "$DOCTORS_RESPONSE" | jq -e '.data.doctors | length > 0' >/dev/null 2>&1; then
            echo "✅ Sample data available - automated database seeding successful"
          else
            echo "❌ Sample data not available - investigating..."

            # Check if it's a 500 error or other issue
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://${LB_URL}/api/doctors")
            echo "HTTP Status: $HTTP_STATUS"

            if [[ "$HTTP_STATUS" == "500" ]]; then
              echo "🔍 500 Internal Server Error detected - checking backend logs..."
              kubectl logs deployment/healthcare-backend-stage3 -n healthcare-stage3-dev --tail=100

              # Check database connection from backend pod
              echo "🗄️ Testing database connection from backend pod..."
              BACKEND_POD=$(kubectl get pods -n healthcare-stage3-dev -l app=healthcare-backend-stage3 -o jsonpath='{.items[0].metadata.name}')
              if [[ -n "$BACKEND_POD" ]]; then
                echo "Testing from pod: $BACKEND_POD"
                kubectl exec -n healthcare-stage3-dev "$BACKEND_POD" -- env | grep -E "(DATABASE|DB_)" || echo "No database env vars found"
              fi
            fi

            exit 1
          fi

          echo "🎉 Automated database setup validation completed successfully!"

      - name: Cleanup temporary files
        if: always()
        working-directory: Project-Stages/Project-Stage-3-Advanced-DevOps-Pipeline/gitops/environments/dev
        run: |
          echo "🧹 Cleaning up temporary files..."

          # Restore original backend.yaml if backup exists
          if [[ -f "backend.yaml.backup" ]]; then
            mv backend.yaml.backup backend.yaml
            echo "✅ Original backend.yaml restored"
          else
            echo "ℹ️ No backup file found, skipping restore"
          fi

  recovery-gitops:
    name: Automated GitOps Recovery
    runs-on: ubuntu-latest
    if: failure() && github.ref == 'refs/heads/main'
    needs: [update-gitops, deploy-infrastructure, deploy-application]
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          persist-credentials: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Configure kubectl for EKS
        working-directory: ${{ env.TERRAFORM_PATH }}/environments/dev
        run: |
          echo "🔧 Resolving cluster name from Terraform outputs..."
          CLUSTER_NAME="healthcare-eks-stage3-dev"
          if terraform output cluster_id >/dev/null 2>&1; then
            CLUSTER_NAME=$(terraform output -raw cluster_id 2>/dev/null || echo "healthcare-eks-stage3-dev")
          fi
          echo "Using cluster: $CLUSTER_NAME"

          echo "⏳ Waiting for EKS cluster ($CLUSTER_NAME) to be ACTIVE..."
          ATTEMPTS=70
          SLEEP_SECONDS=30
          STATUS="UNKNOWN"
          for i in $(seq 1 $ATTEMPTS); do
            STATUS=$(aws eks describe-cluster --region ${{ env.AWS_REGION }} --name "$CLUSTER_NAME" --query 'cluster.status' --output text 2>/dev/null || echo "NOT_FOUND")
            echo "Attempt $i/$ATTEMPTS - Cluster status: $STATUS"
            if [[ "$STATUS" == "ACTIVE" ]]; then
              echo "✅ Cluster is ACTIVE"
              break
            fi
            sleep $SLEEP_SECONDS
          done
          if [[ "$STATUS" != "ACTIVE" ]]; then
            echo "❌ EKS cluster is not ACTIVE or not found"
            exit 1
          fi

          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name "$CLUSTER_NAME"

      - name: Run Automated GitOps Recovery
        working-directory: Project-Stages/Project-Stage-3-Advanced-DevOps-Pipeline
        run: |
          echo "🔧 Running automated GitOps recovery..."

          # Run the GitOps sync fix script
          if [ -f "scripts/fix-gitops-sync.sh" ]; then
            chmod +x scripts/fix-gitops-sync.sh
            ./scripts/fix-gitops-sync.sh
          else
            echo "⚠️ GitOps fix script not found, running manual recovery..."

            # Manual recovery logic
            LATEST_SHA=$(git rev-parse HEAD)
            AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
            ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

            # Update GitOps manifests
            sed -i "s|image: .*healthcare-frontend-stage3:.*|image: ${ECR_REGISTRY}/healthcare-frontend-stage3:${LATEST_SHA}|g" gitops/environments/dev/frontend.yaml
            sed -i "s|image: .*healthcare-backend-stage3:.*|image: ${ECR_REGISTRY}/healthcare-backend-stage3:${LATEST_SHA}|g" gitops/environments/dev/backend.yaml

            # Apply updated manifests
            kubectl apply -f gitops/environments/dev/backend.yaml
            kubectl apply -f gitops/environments/dev/frontend.yaml

            # Wait for rollout

      - name: Install eksctl (recovery)
        run: |
          echo "🔧 Installing eksctl for recovery steps..."
          curl -sL "https://github.com/eksctl-io/eksctl/releases/latest/download/eksctl_$(uname -s)_amd64.tar.gz" | tar xz -C /tmp
          sudo mv /tmp/eksctl /usr/local/bin
          eksctl version

            kubectl rollout status deployment/healthcare-backend-stage3 -n healthcare-stage3-dev --timeout=600s
            kubectl rollout status deployment/healthcare-frontend-stage3 -n healthcare-stage3-dev --timeout=600s
          fi

          echo "✅ GitOps recovery completed"

      - name: Force refresh AWS Load Balancer Controller (pre-recovery-validate)
        working-directory: Project-Stages/Project-Stage-3-Advanced-DevOps-Pipeline
        run: |
          echo "🔄 Force refreshing AWS Load Balancer Controller before recovery validation..."
          chmod +x scripts/deployment/install-aws-load-balancer-controller.sh
          ./scripts/deployment/install-aws-load-balancer-controller.sh healthcare-eks-stage3-dev

      - name: Validate Recovery Success
        run: |
          echo "🔍 Validating recovery success..."

          # Get Application Load Balancer URL from Ingress
          LB_URL=$(kubectl get ingress healthcare-stage3-ingress -n healthcare-stage3-dev -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "")

          if [[ -z "$LB_URL" ]]; then
            echo "❌ Application Load Balancer URL not available"
            kubectl describe ingress healthcare-stage3-ingress -n healthcare-stage3-dev
            exit 1
          fi

          echo "🔗 Using Application Load Balancer: http://$LB_URL"

          # Test application health
          for i in {1..5}; do
            if curl -f "http://${LB_URL}/api/health" | jq -e '.database == "connected"'; then
              echo "✅ Recovery validation successful"
              exit 0
            else
              echo "⏳ Attempt $i/5: Waiting for recovery to complete..."
              sleep 30
            fi
          done

          echo "❌ Recovery validation failed"
          exit 1

  duplicate-cleanup-dryrun:
    name: Diagnose Duplicates (Dry-Run Cleanup)
    runs-on: ubuntu-latest
    if: always() && github.ref == 'refs/heads/main'
    needs: [deploy-infrastructure]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Dry-run duplicate cleanup (visibility only)
        if: failure()
        working-directory: Project-Stages/Project-Stage-3-Advanced-DevOps-Pipeline
        run: |
          echo "🧪 Running enhanced duplicate cleanup in DRY-RUN mode for diagnostics..."
          chmod +x scripts/cleanup/enhanced-duplicate-cleanup.sh
          ./scripts/cleanup/enhanced-duplicate-cleanup.sh true


      - name: Notify Recovery Status
        if: always()
        run: |
          if [ $? -eq 0 ]; then
            echo "🎉 Automated GitOps recovery completed successfully!"
            echo "The pipeline failure has been automatically resolved."
          else
            echo "❌ Automated recovery failed. Manual intervention required."
            echo "Please check the logs and run manual recovery procedures."
          fi