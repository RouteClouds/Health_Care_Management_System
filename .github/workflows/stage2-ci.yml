name: Stage 2 CI (Quality Gates)

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'Project-Stages/Project-Stage-2-Automated-CI-CD-Pipeline/src-code/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'Project-Stages/Project-Stage-2-Automated-CI-CD-Pipeline/src-code/**'
      - '.github/workflows/**'
  workflow_dispatch:

env:
  SOURCE_CODE_PATH: './Project-Stages/Project-Stage-2-Automated-CI-CD-Pipeline/src-code'

jobs:
  unit-tests:
    name: Unit Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18.x, 20.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: '${{ env.SOURCE_CODE_PATH }}/package-lock.json'
      - name: Install dependencies (root + frontend + backend)
        working-directory: ${{ env.SOURCE_CODE_PATH }}
        run: |
          npm install
          cd frontend && npm install
          cd ../backend && npm install
      - name: Run unit tests + coverage
        working-directory: ${{ env.SOURCE_CODE_PATH }}
        run: |
          npm run test:unit
          npm run test:coverage-check

  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: unit-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: '${{ env.SOURCE_CODE_PATH }}/package-lock.json'
      - name: Install dependencies
        working-directory: ${{ env.SOURCE_CODE_PATH }}
        run: npm install
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2.1.1
        with:
          projectBaseDir: ${{ env.SOURCE_CODE_PATH }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  build:
    name: Build images
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Diagnose Docker secrets presence (non-sensitive)
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
        run: |
          for var in DOCKERHUB_USERNAME DOCKERHUB_TOKEN DOCKER_USERNAME DOCKER_PASSWORD DOCKER_TOKEN; do
            if [ -n "${!var}" ]; then echo "$var=present"; else echo "$var=missing"; fi
          done

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          ecr: false
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.SOURCE_CODE_PATH }}
          file: ${{ env.SOURCE_CODE_PATH }}/Dockerfile.frontend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/healthcare-frontend:v1.0
      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.SOURCE_CODE_PATH }}
          file: ${{ env.SOURCE_CODE_PATH }}/Dockerfile.backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/healthcare-backend:v1.0
      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install E2E test deps (pipeline workspace)
        working-directory: Project-Stages/Project-Stage-2-Automated-CI-CD-Pipeline
        run: npm install


  e2e:
    name: E2E (will fail by design for now)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: '${{ env.SOURCE_CODE_PATH }}/package-lock.json'
      - name: Install deps
        working-directory: ${{ env.SOURCE_CODE_PATH }}
        run: npm install
      - name: Start app for E2E
        working-directory: ${{ env.SOURCE_CODE_PATH }}
        run: |
          npm run start:test &
          sleep 20
          curl -f http://localhost:3000
      - name: Run E2E (chrome)
        working-directory: Project-Stages/Project-Stage-2-Automated-CI-CD-Pipeline
        env:
          HEADLESS: 'true'
        run: npm run test:e2e:ci

