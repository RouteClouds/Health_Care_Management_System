name: Stage 2 CI (Quality Gates)

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'Project-Stages/Project-Stage-2-Automated-CI-CD-Pipeline/src-code/**'
      - 'Project-Stages/Project-Stage-2-Automated-CI-CD-Pipeline/k8s/**'
      - 'Project-Stages/Project-Stage-2-Automated-CI-CD-Pipeline/helm-charts/**'
      - 'Project-Stages/Project-Stage-2-Automated-CI-CD-Pipeline/scripts/**'
      - 'Project-Stages/Project-Stage-2-Automated-CI-CD-Pipeline/docs/**'
      - 'Project-Stages/Project-Stage-2-Automated-CI-CD-Pipeline/*.md'
      - '.github/workflows/stage2-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'Project-Stages/Project-Stage-2-Automated-CI-CD-Pipeline/src-code/**'
      - 'Project-Stages/Project-Stage-2-Automated-CI-CD-Pipeline/k8s/**'
      - 'Project-Stages/Project-Stage-2-Automated-CI-CD-Pipeline/helm-charts/**'
      - 'Project-Stages/Project-Stage-2-Automated-CI-CD-Pipeline/scripts/**'
      - 'Project-Stages/Project-Stage-2-Automated-CI-CD-Pipeline/docs/**'
      - 'Project-Stages/Project-Stage-2-Automated-CI-CD-Pipeline/*.md'
  workflow_dispatch:

env:
  SOURCE_CODE_PATH: './Project-Stages/Project-Stage-2-Automated-CI-CD-Pipeline/src-code'

jobs:
  unit-tests:
    name: Unit Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18.x, 20.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: '${{ env.SOURCE_CODE_PATH }}/package-lock.json'
      - name: Install dependencies (root + frontend + backend)
        working-directory: ${{ env.SOURCE_CODE_PATH }}
        run: |
          npm install
          cd frontend && npm install
          cd ../backend && npm install
      - name: Run unit tests + coverage
        working-directory: ${{ env.SOURCE_CODE_PATH }}
        run: |
          npm run test:unit
          npm run test:coverage-check

  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: unit-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: '${{ env.SOURCE_CODE_PATH }}/package-lock.json'
      - name: Install dependencies
        working-directory: ${{ env.SOURCE_CODE_PATH }}
        run: npm install
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2.1.1
        with:
          projectBaseDir: ${{ env.SOURCE_CODE_PATH }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  build:
    name: Build images
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Diagnose Docker secrets presence (non-sensitive)
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
        run: |
          for var in DOCKERHUB_USERNAME DOCKERHUB_TOKEN DOCKER_USERNAME DOCKER_PASSWORD DOCKER_TOKEN; do
            if [ -n "${!var}" ]; then echo "$var=present"; else echo "$var=missing"; fi
          done

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          ecr: false
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push frontend image (K8s build)
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.SOURCE_CODE_PATH }}
          file: ${{ env.SOURCE_CODE_PATH }}/Dockerfile.frontend.k8s
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/healthcare-frontend:latest

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.SOURCE_CODE_PATH }}
          file: ${{ env.SOURCE_CODE_PATH }}/Dockerfile.backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/healthcare-backend:latest
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: '${{ env.SOURCE_CODE_PATH }}/package-lock.json'
      - name: Install deps (app)
        working-directory: ${{ env.SOURCE_CODE_PATH }}
        run: npm install
      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
      - name: Install E2E test deps (pipeline workspace)
        working-directory: Project-Stages/Project-Stage-2-Automated-CI-CD-Pipeline
        run: npm install
      - name: Start app for E2E
        working-directory: ${{ env.SOURCE_CODE_PATH }}
        run: |
          npm run start:test &
          sleep 20
          curl -f http://localhost:3000
      - name: Run E2E (chrome)
        working-directory: Project-Stages/Project-Stage-2-Automated-CI-CD-Pipeline
        env:
          HEADLESS: 'true'
        run: npm run test:e2e:ci

  deploy:
    name: Deploy to EKS (stage-2)
    runs-on: ubuntu-latest
    needs: [build, e2e]
    if: ${{ github.ref == 'refs/heads/main' }}
    env:
      EKS_CLUSTER_NAME: healthcare-cluster-stage2
      AWS_REGION: us-east-1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.30.0

      - name: Update kubeconfig for EKS
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"

      - name: Create namespace (healthcare) if not exists
        run: kubectl create namespace healthcare --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply Kubernetes manifests
        run: |
          echo "🚀 Applying Kubernetes manifests..."
          kubectl apply -f Project-Stages/Project-Stage-2-Automated-CI-CD-Pipeline/k8s/

      - name: Force rollout restart (ensure latest images are pulled)
        run: |
          echo "🔄 Forcing rollout restart to pull latest images..."
          echo "📝 Adding restart annotation to force pod recreation..."

          # Add restart annotation with timestamp to force pod recreation
          TIMESTAMP=$(date +%s)
          kubectl patch deployment healthcare-frontend -n healthcare -p "{\"spec\":{\"template\":{\"metadata\":{\"annotations\":{\"kubectl.kubernetes.io/restartedAt\":\"${TIMESTAMP}\"}}}}}"
          kubectl patch deployment healthcare-backend -n healthcare -p "{\"spec\":{\"template\":{\"metadata\":{\"annotations\":{\"kubectl.kubernetes.io/restartedAt\":\"${TIMESTAMP}\"}}}}}"

          echo "✅ Restart annotations added successfully"

      - name: Wait for rollout to complete
        run: |
          echo "⏳ Waiting for deployments to complete..."
          kubectl rollout status deployment/healthcare-backend -n healthcare --timeout=300s
          kubectl rollout status deployment/healthcare-frontend -n healthcare --timeout=300s
          echo "✅ Rollout completed successfully"

      - name: Verify deployment
        run: |
          echo "🔍 Verifying deployment status..."
          echo "📊 Services:"
          kubectl get services -n healthcare
          echo ""
          echo "🚀 Pods:"
          kubectl get pods -n healthcare -o wide
          echo ""
          echo "🏷️ Image tags in use:"
          kubectl get pods -n healthcare -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.spec.containers[0].image}{"\n"}{end}'
          echo ""
          echo "✅ Deployment verification complete"
