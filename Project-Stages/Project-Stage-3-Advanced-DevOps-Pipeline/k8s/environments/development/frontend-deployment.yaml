apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthcare-frontend
  namespace: healthcare-dev
  labels:
    app: healthcare-frontend
    environment: development
    tier: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: healthcare-frontend
      environment: development
  template:
    metadata:
      labels:
        app: healthcare-frontend
        environment: development
        tier: frontend
    spec:
      containers:
      - name: frontend
        image: 867344452513.dkr.ecr.us-east-1.amazonaws.com/healthcare-frontend-stage3:dev
        ports:
        - containerPort: 80
        env:
        - name: NODE_ENV
          value: "development"
        - name: VITE_API_BASE_URL
          value: "/api"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: healthcare-frontend-service
  namespace: healthcare-dev
  labels:
    app: healthcare-frontend
    environment: development
spec:
  selector:
    app: healthcare-frontend
    environment: development
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
  type: LoadBalancer
