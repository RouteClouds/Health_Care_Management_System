apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthcare-backend-stage3
  namespace: healthcare-stage3-dev
  labels:
    app: healthcare-backend-stage3
    tier: backend
    environment: dev
    stage: stage-3
spec:
  replicas: 2
  selector:
    matchLabels:
      app: healthcare-backend-stage3
      tier: backend
  template:
    metadata:
      labels:
        app: healthcare-backend-stage3
        tier: backend
        environment: dev
        stage: stage-3
    spec:
      containers:
      - name: backend
        image: 867344452513.dkr.ecr.us-east-1.amazonaws.com/healthcare-backend-stage3:d6cf0a1f8653e6f71d5548c06f2adc4c829f1e79
        imagePullPolicy: Always
        ports:
        - containerPort: 3001
          name: http
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "400m"
        env:
        - name: NODE_ENV
          value: "development"
        - name: PORT
          value: "3001"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: database-credentials-stage3
              key: url
        - name: CORS_ORIGIN
          value: "http://frontend-stage3-svc.healthcare-stage3-dev.svc.cluster.local"
        - name: STAGE
          value: "stage-3"
        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 5
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: backend-stage3-svc
  namespace: healthcare-stage3-dev
  labels:
    app: healthcare-backend-stage3
    tier: backend
    environment: dev
    stage: stage-3
spec:
  type: ClusterIP
  ports:
  - port: 3001
    targetPort: 3001
    protocol: TCP
    name: http
  selector:
    app: healthcare-backend-stage3
    tier: backend

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: healthcare-backend-stage3-hpa
  namespace: healthcare-stage3-dev
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: healthcare-backend-stage3
  minReplicas: 2
  maxReplicas: 15
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

---
apiVersion: v1
kind: Secret
metadata:
  name: database-credentials-stage3
  namespace: healthcare-stage3-dev
type: Opaque
stringData:
  url: "postgresql://healthcare_stage3_user:healthcare_stage3_password_change_me@healthcare-eks-stage3-dev-db.cluster-xyz.us-east-1.rds.amazonaws.com:5432/healthcare_stage3_db"
  host: "healthcare-eks-stage3-dev-db.cluster-xyz.us-east-1.rds.amazonaws.com"
  port: "5432"
  database: "healthcare_stage3_db"
  username: "healthcare_stage3_user"
  password: "healthcare_stage3_password_change_me"
