apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthcare-frontend-stage3
  namespace: healthcare-stage3-dev
  labels:
    app: healthcare-frontend-stage3
    tier: frontend
    environment: dev
    stage: stage-3
spec:
  replicas: 2
  selector:
    matchLabels:
      app: healthcare-frontend-stage3
      tier: frontend
  template:
    metadata:
      labels:
        app: healthcare-frontend-stage3
        tier: frontend
        environment: dev
        stage: stage-3
    spec:
      containers:
      - name: frontend
        image: 867344452513.dkr.ecr.us-east-1.amazonaws.com/healthcare-frontend-stage3:5e622762586f7868a8bcda0e7684c8ed56def63b
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        env:
        - name: REACT_APP_API_URL
          value: "http://backend-stage3-svc.healthcare-stage3-dev.svc.cluster.local:3001"
        - name: REACT_APP_ENVIRONMENT
          value: "dev"
        - name: REACT_APP_STAGE
          value: "stage-3"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: frontend-stage3-svc
  namespace: healthcare-stage3-dev
  labels:
    app: healthcare-frontend-stage3
    tier: frontend
    environment: dev
    stage: stage-3
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    app: healthcare-frontend-stage3
    tier: frontend

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: healthcare-frontend-stage3-hpa
  namespace: healthcare-stage3-dev
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: healthcare-frontend-stage3
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
