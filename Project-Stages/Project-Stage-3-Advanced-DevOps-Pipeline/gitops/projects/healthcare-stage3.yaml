apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: healthcare-stage3
  namespace: argocd
  labels:
    app.kubernetes.io/name: healthcare-stage3-project
    app.kubernetes.io/part-of: healthcare-stage3
spec:
  description: Healthcare Management System Stage-3 Project
  
  # Source repositories
  sourceRepos:
    - 'https://github.com/RouteClouds/Health_Care_Management_System.git'
    - 'https://github.com/prometheus-operator/prometheus-operator.git'
    - 'https://charts.bitnami.com/bitnami'
    - 'https://prometheus-community.github.io/helm-charts'
    - 'https://grafana.github.io/helm-charts'
    - 'https://helm.elastic.co'
    - 'https://jaegertracing.github.io/helm-charts'

  # Destination clusters and namespaces
  destinations:
    - namespace: 'healthcare-stage3-*'
      server: https://kubernetes.default.svc
    - namespace: 'monitoring'
      server: https://kubernetes.default.svc
    - namespace: 'logging'
      server: https://kubernetes.default.svc
    - namespace: 'tracing'
      server: https://kubernetes.default.svc
    - namespace: 'argocd'
      server: https://kubernetes.default.svc
  
  # Cluster resource allow list
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
    - group: 'rbac.authorization.k8s.io'
      kind: ClusterRole
    - group: 'rbac.authorization.k8s.io'
      kind: ClusterRoleBinding
    - group: 'apiextensions.k8s.io'
      kind: CustomResourceDefinition
    - group: 'admissionregistration.k8s.io'
      kind: MutatingWebhookConfiguration
    - group: 'admissionregistration.k8s.io'
      kind: ValidatingWebhookConfiguration
  
  # Namespace resource allow list
  namespaceResourceWhitelist:
    - group: ''
      kind: '*'
    - group: 'apps'
      kind: '*'
    - group: 'extensions'
      kind: '*'
    - group: 'networking.k8s.io'
      kind: '*'
    - group: 'autoscaling'
      kind: '*'
    - group: 'policy'
      kind: '*'
    - group: 'monitoring.coreos.com'
      kind: '*'
    - group: 'logging.coreos.com'
      kind: '*'
    - group: 'rbac.authorization.k8s.io'
      kind: '*'
    - group: 'batch'
      kind: '*'
    - group: 'argoproj.io'
      kind: 'Application'

  # Roles for project members
  roles:
    - name: admin
      description: Admin access to healthcare-stage3 project
      policies:
        - p, proj:healthcare-stage3:admin, applications, *, healthcare-stage3/*, allow
        - p, proj:healthcare-stage3:admin, repositories, *, *, allow
        - p, proj:healthcare-stage3:admin, clusters, *, *, allow
      groups:
        - healthcare-stage3-admins
    
    - name: developer
      description: Developer access to healthcare-stage3 project
      policies:
        - p, proj:healthcare-stage3:developer, applications, get, healthcare-stage3/*, allow
        - p, proj:healthcare-stage3:developer, applications, sync, healthcare-stage3/*, allow
        - p, proj:healthcare-stage3:developer, repositories, get, *, allow
      groups:
        - healthcare-stage3-developers
    
    - name: readonly
      description: Read-only access to healthcare-stage3 project
      policies:
        - p, proj:healthcare-stage3:readonly, applications, get, healthcare-stage3/*, allow
        - p, proj:healthcare-stage3:readonly, repositories, get, *, allow
      groups:
        - healthcare-stage3-viewers
