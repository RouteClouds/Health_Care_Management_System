# Prometheus Configuration for Healthcare Management System
# Stage 2 Enhanced Infrastructure
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: healthcare-system
  labels:
    app: prometheus
    component: monitoring
    environment: multi
spec:
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: 'healthcare-eks'
        environment: '${ENVIRONMENT}'
    
    rule_files:
      - "/etc/prometheus/rules/*.yml"
    
    alerting:
      alertmanagers:
        - static_configs:
            - targets:
              - alertmanager:9093
    
    scrape_configs:
      # Prometheus self-monitoring
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']
        scrape_interval: 5s
        metrics_path: /metrics
      
      # Kubernetes API server
      - job_name: 'kubernetes-apiservers'
        kubernetes_sd_configs:
          - role: endpoints
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
            action: keep
            regex: default;kubernetes;https
      
      # Kubernetes nodes
      - job_name: 'kubernetes-nodes'
        kubernetes_sd_configs:
          - role: node
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics
      
      # Healthcare Backend Application
      - job_name: 'healthcare-backend'
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - healthcare-system
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: backend-service
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: metrics
          - source_labels: [__meta_kubernetes_namespace]
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_service_name]
            target_label: kubernetes_name
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: kubernetes_pod_name
        scrape_interval: 10s
        metrics_path: /metrics
      
      # Healthcare Frontend Application
      - job_name: 'healthcare-frontend'
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - healthcare-system
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: frontend-service
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: metrics
          - source_labels: [__meta_kubernetes_namespace]
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_service_name]
            target_label: kubernetes_name
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: kubernetes_pod_name
        scrape_interval: 10s
        metrics_path: /metrics
      
      # PostgreSQL Database
      - job_name: 'postgresql'
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - healthcare-system
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: postgres-service
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: metrics
        scrape_interval: 30s
      
      # Node Exporter
      - job_name: 'node-exporter'
        kubernetes_sd_configs:
          - role: endpoints
        relabel_configs:
          - source_labels: [__meta_kubernetes_endpoints_name]
            action: keep
            regex: node-exporter
        scrape_interval: 15s
      
      # cAdvisor (Container metrics)
      - job_name: 'kubernetes-cadvisor'
        kubernetes_sd_configs:
          - role: node
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
        scrape_interval: 15s
      
      # Healthcare-specific metrics
      - job_name: 'healthcare-custom-metrics'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - healthcare-system
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: kubernetes_pod_name
        scrape_interval: 10s

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: healthcare-system
  labels:
    app: prometheus
    component: rules
data:
  healthcare-alerts.yml: |
    groups:
      - name: healthcare.rules
        rules:
          # High-level application alerts
          - alert: HealthcareBackendDown
            expr: up{job="healthcare-backend"} == 0
            for: 1m
            labels:
              severity: critical
              service: backend
            annotations:
              summary: "Healthcare backend service is down"
              description: "Healthcare backend has been down for more than 1 minute"
          
          - alert: HealthcareFrontendDown
            expr: up{job="healthcare-frontend"} == 0
            for: 1m
            labels:
              severity: critical
              service: frontend
            annotations:
              summary: "Healthcare frontend service is down"
              description: "Healthcare frontend has been down for more than 1 minute"
          
          - alert: DatabaseConnectionFailure
            expr: up{job="postgresql"} == 0
            for: 30s
            labels:
              severity: critical
              service: database
            annotations:
              summary: "Database connection failure"
              description: "PostgreSQL database is unreachable"
          
          # Performance alerts
          - alert: HighResponseTime
            expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
            for: 2m
            labels:
              severity: warning
              service: api
            annotations:
              summary: "High API response time"
              description: "95th percentile response time is above 2 seconds"
          
          - alert: HighErrorRate
            expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.05
            for: 1m
            labels:
              severity: warning
              service: api
            annotations:
              summary: "High error rate detected"
              description: "Error rate is above 5% for the last 5 minutes"
          
          # Resource alerts
          - alert: HighCPUUsage
            expr: rate(container_cpu_usage_seconds_total[5m]) * 100 > 80
            for: 5m
            labels:
              severity: warning
              resource: cpu
            annotations:
              summary: "High CPU usage"
              description: "CPU usage is above 80% for 5 minutes"
          
          - alert: HighMemoryUsage
            expr: (container_memory_usage_bytes / container_spec_memory_limit_bytes) * 100 > 85
            for: 3m
            labels:
              severity: warning
              resource: memory
            annotations:
              summary: "High memory usage"
              description: "Memory usage is above 85% for 3 minutes"
          
          # Healthcare-specific alerts
          - alert: PatientDataAccessFailure
            expr: increase(patient_data_access_errors_total[5m]) > 5
            for: 1m
            labels:
              severity: critical
              compliance: hipaa
            annotations:
              summary: "Patient data access failures detected"
              description: "Multiple patient data access failures may indicate security issues"
          
          - alert: AppointmentSystemDown
            expr: appointment_system_health == 0
            for: 30s
            labels:
              severity: critical
              business_impact: high
            annotations:
              summary: "Appointment system is down"
              description: "Critical business function unavailable"
