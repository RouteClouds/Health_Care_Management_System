apiVersion: v1
kind: Namespace
metadata:
  name: healthcare-dev
  labels:
    environment: development
    project: healthcare-management
    stage: "2"
    compliance: hipaa
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: healthcare-dev-quota
  namespace: healthcare-dev
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 4Gi
    limits.cpu: "4"
    limits.memory: 8Gi
    persistentvolumeclaims: "4"
    services: "10"
    secrets: "10"
    configmaps: "10"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: healthcare-dev-limits
  namespace: healthcare-dev
spec:
  limits:
  - default:
      cpu: 500m
      memory: 512Mi
    defaultRequest:
      cpu: 100m
      memory: 128Mi
    type: Container
