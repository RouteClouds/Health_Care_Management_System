apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthcare-backend
  namespace: healthcare-dev
  labels:
    app: healthcare-backend
    environment: development
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: healthcare-backend
      environment: development
  template:
    metadata:
      labels:
        app: healthcare-backend
        environment: development
        tier: backend
    spec:
      containers:
      - name: backend
        image: routeclouds/healthcare-backend:v1.0
        ports:
        - containerPort: 3001
        env:
        - name: NODE_ENV
          value: "development"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: healthcare-secrets
              key: database-url
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: healthcare-secrets
              key: jwt-secret
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3001
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/ready
            port: 3001
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: healthcare-backend-service
  namespace: healthcare-dev
  labels:
    app: healthcare-backend
    environment: development
spec:
  selector:
    app: healthcare-backend
    environment: development
  ports:
  - port: 3001
    targetPort: 3001
    protocol: TCP
  type: ClusterIP
