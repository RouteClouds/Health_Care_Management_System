apiVersion: v1
kind: Namespace
metadata:
  name: healthcare-prod
  labels:
    environment: production
    project: healthcare-management
    stage: "2"
    compliance: hipaa
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: healthcare-prod-quota
  namespace: healthcare-prod
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 16Gi
    limits.cpu: "16"
    limits.memory: 32Gi
    persistentvolumeclaims: "10"
    services: "20"
    secrets: "20"
    configmaps: "20"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: healthcare-prod-limits
  namespace: healthcare-prod
spec:
  limits:
  - default:
      cpu: 2000m
      memory: 2Gi
    defaultRequest:
      cpu: 500m
      memory: 512Mi
    type: Container
