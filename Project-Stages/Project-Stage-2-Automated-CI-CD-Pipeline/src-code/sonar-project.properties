# SonarCloud configuration for Stage-2 src-code
# Update sonar.projectKey below if your actual key differs
sonar.host.url=https://sonarcloud.io
sonar.organization=routeclouds
sonar.projectKey=routeclouds_Health_Care_Management_System

# Source paths (multi-package workspace)
sonar.sources=frontend/src,backend/src
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**

# Test and coverage reports
# Adjust paths if your coverage files are generated elsewhere
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info,backend/coverage/lcov.info
sonar.typescript.tsconfigPath=frontend/tsconfig.json

