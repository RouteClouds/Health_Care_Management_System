# SonarQube Project Configuration
# Healthcare Management System - Stage 2
# Code Quality Analysis and Quality Gates

# Project identification
sonar.projectKey=healthcare-management-system
sonar.projectName=Healthcare Management System
sonar.projectVersion=2.0.0
sonar.organization=healthcare-org

# Source code configuration
sonar.sources=src-code/frontend/src,src-code/backend/src
sonar.tests=src-code/frontend/src,src-code/backend/src
sonar.test.inclusions=**/*.test.js,**/*.test.ts,**/*.test.jsx,**/*.test.tsx,**/*.spec.js,**/*.spec.ts,**/*.spec.jsx,**/*.spec.tsx

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/*.config.js,**/*.config.ts,**/public/**,**/assets/**,**/*.d.ts,**/migrations/**,**/seeds/**

# Test exclusions
sonar.test.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**

# Coverage configuration
sonar.javascript.lcov.reportPaths=src-code/coverage/lcov.info
sonar.typescript.lcov.reportPaths=src-code/coverage/lcov.info
sonar.coverage.exclusions=**/*.test.js,**/*.test.ts,**/*.test.jsx,**/*.test.tsx,**/*.spec.js,**/*.spec.ts,**/*.spec.jsx,**/*.spec.tsx,**/*.config.js,**/*.config.ts,**/index.js,**/index.ts,**/main.js,**/main.ts

# Language-specific settings
sonar.javascript.file.suffixes=.js,.jsx
sonar.typescript.file.suffixes=.ts,.tsx

# Quality gate configuration
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# Analysis parameters
sonar.sourceEncoding=UTF-8
sonar.scm.provider=git
sonar.scm.forceReloadAll=true

# Branch analysis
sonar.branch.name=${GITHUB_REF_NAME}
sonar.pullrequest.key=${GITHUB_PR_NUMBER}
sonar.pullrequest.branch=${GITHUB_HEAD_REF}
sonar.pullrequest.base=${GITHUB_BASE_REF}

# Security hotspots
sonar.security.hotspots.inheritFromParent=true

# Duplication settings
sonar.cpd.exclusions=**/*.test.js,**/*.test.ts,**/*.test.jsx,**/*.test.tsx

# Issue assignment
sonar.issues.defaultAssigneeLogin=admin

# Notification settings
sonar.notifications.delay=60

# Plugin settings
sonar.eslint.reportPaths=src-code/eslint-report.json
sonar.tslint.reportPaths=src-code/tslint-report.json

# Custom metrics
sonar.metric.complexity.maximum=10
sonar.metric.coverage.minimum=80
sonar.metric.duplicated_lines_density.maximum=3

# Healthcare-specific quality rules
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5

# Rule: Ignore console.log in development files
sonar.issue.ignore.multicriteria.e1.ruleKey=javascript:S2228
sonar.issue.ignore.multicriteria.e1.resourceKey=**/dev/**

# Rule: Ignore TODO comments in development
sonar.issue.ignore.multicriteria.e2.ruleKey=javascript:S1135
sonar.issue.ignore.multicriteria.e2.resourceKey=**/dev/**,**/test/**

# Rule: Allow longer functions in test files
sonar.issue.ignore.multicriteria.e3.ruleKey=javascript:S138
sonar.issue.ignore.multicriteria.e3.resourceKey=**/*.test.*,**/*.spec.*

# Rule: Allow magic numbers in test files
sonar.issue.ignore.multicriteria.e4.ruleKey=javascript:S109
sonar.issue.ignore.multicriteria.e4.resourceKey=**/*.test.*,**/*.spec.*

# Rule: Allow unused variables in type definitions
sonar.issue.ignore.multicriteria.e5.ruleKey=typescript:S1481
sonar.issue.ignore.multicriteria.e5.resourceKey=**/*.d.ts
